<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor visual — Workshop</title>
<link rel="stylesheet" href="/editor/cms-editor.css">
<link rel="stylesheet" href="/editor/cms-pro-editor.css">
</head>
<body>
<header class="cms-editor-bar">
  <a class="editor-wordmark" href="/admin/pages.php">← Páginas</a>
  <div class="editor-page-title"><strong id="editor-title">Carregando…</strong><span id="editor-locale"></span></div>
  <div class="editor-toolbar" aria-label="Visualização">
    <button type="button" data-viewport="desktop" class="active">Desktop</button>
    <button type="button" data-viewport="tablet">Tablet</button>
    <button type="button" data-viewport="mobile">Mobile</button>
  </div>
  <div class="editor-toolbar">
    <button type="button" id="add-section">+ Seção</button>
    <button type="button" id="page-settings">Página</button>
    <button type="button" id="undo" disabled>Desfazer</button>
    <button type="button" id="redo" disabled>Refazer</button>
  </div>
  <div class="editor-toolbar editor-actions">
    <span id="save-status" aria-live="polite"></span>
    <button type="button" id="save-page" class="primary">Salvar</button>
    <button type="button" id="publish-page" class="publish">Publicar</button>
  </div>
</header>
<main class="cms-editor-workspace">
  <aside class="editor-panel sections-panel">
    <div class="panel-heading"><p>Estrutura</p><h2>Seções</h2></div>
    <div id="sections-list" class="sections-list"></div>
    <button type="button" id="add-section-side" class="panel-button">+ Adicionar seção</button>
  </aside>
  <section class="editor-canvas" aria-label="Página em edição"><div class="device-frame desktop" id="device-frame"><iframe id="page-frame" title="Página em edição"></iframe></div></section>
  <aside class="editor-panel inspector" id="inspector"><div class="inspector-empty"><p>Selecione texto, imagem, formulário ou seção diretamente na página.</p></div></aside>
</main>
<div class="floating-format" id="text-toolbar" hidden>
  <button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" data-command="createLink">Link</button><button type="button" data-command="removeFormat">Limpar</button><button type="button" id="finish-text">Concluir</button>
</div>
<dialog id="section-dialog" class="editor-dialog"><form method="dialog"><header><div><p>Biblioteca</p><h2>Adicionar seção</h2></div><button value="cancel" aria-label="Fechar">×</button></header><div class="section-library" id="section-library"></div></form></dialog>
<dialog id="media-dialog" class="editor-dialog wide"><form method="dialog"><header><div><p>Biblioteca de mídia</p><h2>Escolher imagem</h2></div><button value="cancel" aria-label="Fechar">×</button></header><label class="upload-label">Enviar nova imagem <input id="media-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="media-grid" id="media-grid"></div></form></dialog>
<div class="editor-toast" id="toast" role="status"></div>
<script src="/editor/media-library.js"></script>
<script src="/editor/cms-editor-v3.js"></script>
<script src="/editor/autosave.js"></script>
<script src="/editor/cms-pro-editor.js"></script>
<script src="/editor/cms-layout-editor.js"></script>
<script src="/editor/cms-pro-compat.js"></script>
</body>
</html>
