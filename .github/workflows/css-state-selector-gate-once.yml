name: css-state-selector-gate-once
on:
  push:
    branches:
      - refactor/css-system-sanitization-2026-09-28
permissions:
  contents: write
jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-system-sanitization-2026-09-28
      - name: Record selector ownership gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('docs/PROJECT_STATE.md')
          text=path.read_text(encoding='utf-8')
          old='- `tools/audit-css-ownership.php --strict` bloqueia redefinição da mesma propriedade no mesmo seletor e contexto de cascata. `tools/consolidate-css-ownership.php --check` bloqueia consolidações determinísticas pendentes.'
          new='- `tools/audit-css-ownership.php --strict` bloqueia redefinição da mesma propriedade no mesmo seletor e contexto de cascata. `tools/consolidate-css-ownership.php --check` bloqueia consolidações determinísticas pendentes e `tools/consolidate-css-selectors.php --check` bloqueia divisões de seletor que ainda podem ser reunidas sem alterar a ordem efetiva da cascata.'
          if old not in text:
              raise SystemExit('CSS ownership gate paragraph not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit canonical state and remove one-time workflow
        run: |
          git rm .github/workflows/css-state-selector-gate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md
          git commit -m 'Record CSS selector ownership gate in project state'
          git push origin HEAD:refactor/css-system-sanitization-2026-09-28
