name: validate
on:
  pull_request:
  push:
    branches:
      - 'refactor/**'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, dom, mbstring, gd, imagick
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -path './dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets editor admin tools -name '*.js' -o -name '*.cjs' | xargs -r -n1 node --check
      - name: CMS smoke tests
        run: |
          php tools/test-cms.php
          php tools/test-cms-v3.php
          php tools/test-cms-professional-3.php
          php tools/test-task-centric-admin.php
          php tools/test-admin-submissions-layout.php
          php tools/test-analytics-dashboard.php
          php tools/test-responsive-layout-contract.php
          php tools/test-content-structure-editor.php
          php tools/test-form-editor-integration.php
          php tools/test-media-image-policy.php
          php tools/test-media-maintenance.php
          php tools/test-media-derivative-integrity.php
          php tools/test-media-list-service.php
          php tools/test-media-detail-interactive.php
          php tools/test-png-derivative-delivery.php
          php tools/test-design-css-cascade.php
          php tools/test-page-seo-seed.php
          php tools/test-registration-google-form-parity.php
          php tools/test-registration-payment-migration.php
          php tools/test-registration-native-content.php
          php tools/test-registration-success-payment.php
          php tools/test-update-service.php
          php tools/test-update-restore.php
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser interaction regression
        run: |
          php -S 127.0.0.1:8099 -t . >/tmp/workshop-browser.log 2>&1 &
          PHP_SERVER_PID=$!
          trap 'kill $PHP_SERVER_PID' EXIT
          sleep 1
          npm run test:browser
      - name: Build script tests
        run: php tools/test-build-dist.php
      - name: Distribution dry run
        run: php tools/build-dist.php --dry-run
