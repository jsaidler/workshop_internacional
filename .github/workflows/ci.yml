name: validate
on:
  pull_request:
  push:
    branches:
      - 'refactor/**'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, dom, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -path './dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets editor admin -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: CMS smoke tests
        run: |
          php tools/test-cms.php
          php tools/test-task-centric-admin.php
          php tools/test-media-list-service.php
          php tools/test-media-detail-interactive.php
      - name: Build script tests
        run: php tools/test-build-dist.php
      - name: Distribution dry run
        run: php tools/build-dist.php --dry-run
