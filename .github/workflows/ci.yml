name: validate
on:
  pull_request:
  push:
    branches:
      - 'refactor/**'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, dom, mbstring, gd, imagick, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -path './dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets editor admin tools -name '*.js' -o -name '*.cjs' | xargs -r -n1 node --check
      - name: CSS architecture
        run: php tools/test-css-architecture.php
      - name: CSS ownership
        run: |
          php tools/audit-css-ownership.php --strict
          php tools/consolidate-css-ownership.php --check
          php tools/consolidate-css-selectors.php --check
      - name: CMS smoke tests
        run: |
          php tools/test-cms.php
          php tools/test-cms-v3.php
          php tools/test-cms-professional-3.php
          php tools/test-task-centric-admin.php
          php tools/test-admin-product-ux-foundation.php
          php tools/test-admin-operational-ux.php
          php tools/test-admin-teaching-ux.php
          php tools/test-admin-submissions-layout.php
          php tools/test-analytics-dashboard.php
          php tools/test-responsive-layout-contract.php
          php tools/test-content-structure-editor.php
          php tools/test-form-editor-integration.php
          php tools/test-global-public-form-ux.php
          php tools/test-media-image-policy.php
          php tools/test-media-maintenance.php
          php tools/test-media-derivative-integrity.php
          php tools/test-media-list-service.php
          php tools/test-media-detail-interactive.php
          php tools/test-png-derivative-delivery.php
          php tools/test-design-css-cascade.php
          php tools/test-page-seo-seed.php
          php tools/test-pinhole-lambe-lambe-page.php
          php tools/test-pinhole-camera-authority.php
          php tools/test-pinhole-hybrid-format.php
          php tools/test-pinhole-hybrid-coherence.php
          php tools/test-pinhole-page-integrity-repair.php
          php tools/test-pinhole-two-versions-offer.php
          php tools/test-registration-google-form-parity.php
          php tools/test-registration-payment-migration.php
          php tools/test-registration-native-content.php
          php tools/test-registration-success-payment.php
          php tools/test-student-area.php
          php tools/test-student-accounts.php
          php tools/test-multi-course-enrollment.php
          php tools/test-student-dashboard-truth.php
          php tools/test-student-course-context.php
          php tools/test-student-account-experience.php
          php tools/test-student-material-context.php
          php tools/test-student-login-experience.php
          php tools/test-student-premium-ui.php
          php tools/test-global-ui-consumption.php
          php tools/test-workshop-page-architecture.php
          php tools/test-workshop-page-enrollment-scope.php
          php tools/test-course-domain-material.php
          php tools/test-course-material-release-filter.php
          php tools/test-course-admin-context.php
          php tools/test-admin-domain-recovery.php
          php tools/test-course-reconciliation-snapshot.php
          php tools/test-admin-student-ux-audit.php
          php tools/test-course-sharing-scope.php
          php tools/test-student-tests-context.php
          php tools/test-student-test-workflow.php
          php tools/test-student-area-transversal.php
          php tools/test-student-workspace.php
          php tools/test-student-workflow-experience.php
          php tools/test-student-process-notes-ux.php
          php tools/test-student-notes-runtime.php
          php tools/test-student-question-annotation.php
          php tools/test-student-interaction-continuity.php
          php tools/test-student-mechanics-audit.php
          php tools/test-student-area-information-architecture.php
          php tools/test-student-mobile-experience.php
          php tools/test-admin-lifecycle-and-student-design.php
          php tools/test-student-platform-coherence.php
          php tools/test-student-handbook.php
          php tools/test-student-material-system.php
          php tools/test-student-material-access-hotfix.php
          php tools/test-student-placeholder-visibility.php
          php tools/test-private-media-editor-contract.php
          php tools/test-canonical-student-media-access.php
          php tools/test-handbook-email-integrity.php
          php tools/test-system-authority-boundaries.php
          php tools/test-read-purity-activity-templates.php
          php tools/test-activity-locales-page-hierarchy.php
          php tools/test-pages-admin-ux.php
          php tools/test-admin-site-ux.php
          php tools/test-editor-runtime-integration.php
          php tools/test-cms-page-access.php
          php tools/test-cms-section-access.php
          php tools/test-material-lesson-sections.php
          php tools/test-update-service.php
          php tools/test-update-restore.php
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Browser interaction regression
        run: |
          php -S 127.0.0.1:8099 -t . >/tmp/workshop-browser.log 2>&1 &
          PHP_SERVER_PID=$!
          trap 'kill $PHP_SERVER_PID' EXIT
          sleep 1
          npm run test:browser
          npx playwright test tools/browser-tests/student-inline-annotations.spec.cjs --browser=webkit
      - name: Build script tests
        run: php tools/test-build-dist.php
      - name: Distribution dry run
        run: php tools/build-dist.php --dry-run
