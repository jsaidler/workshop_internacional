name: css-state-doc-once
on:
  push:
    branches:
      - refactor/css-system-sanitization-2026-09-28
permissions:
  contents: write
jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-system-sanitization-2026-09-28
      - name: Reconcile canonical CSS state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('docs/PROJECT_STATE.md')
          text=path.read_text(encoding='utf-8')
          old='''Checkbox e radio são um único componente nativo em três contextos: site público, preview/editor e administração. A geometria deve permanecer 18 × 18 px em todos eles. Regras genéricas de `input` não podem lhes impor largura total, altura de campo de texto, padding ou flex expansivo. A área administrativa aplica essa regra globalmente em `body.admin-page`, com limites mínimos e máximos e uma garantia estrutural no shell, não apenas no editor de formulários.\n\nA captura de 13/09 mostrou um detalhe importante: o círculo/quadrado nativo podia parecer pequeno, mas o elemento `input` continuava ocupando a largura inteira da linha por causa do CSS legado de campos de texto. O sintoma visual era o marcador centralizado e o texto empurrado para a direita. Portanto o critério de correção não é apenas o diâmetro visível; a caixa do próprio `input` precisa estar efetivamente limitada a 18 × 18 px.\n\nComo uma atualização de CSS pode ficar mascarada por cache antigo do navegador, os renderers público, editor e admin versionam seus assets com a versão instalada (`deploy-info.json`). Invariantes visuais críticos podem ter uma regra estrutural inline no shell correspondente, sempre em escopo global da aplicação e nunca por página específica.'''
          new='''Checkbox e radio são um único componente nativo em três contextos: site público, preview/editor e administração. A geometria deve permanecer 18 × 18 px em todos eles. Regras genéricas de `input` não podem lhes impor largura total, altura de campo de texto, padding ou flex expansivo. Essa geometria pertence ao proprietário CSS canônico de cada superfície; o shell não contém patch visual inline nem duplicação estrutural do componente.\n\nA captura de 13/09 mostrou um detalhe importante: o círculo/quadrado nativo podia parecer pequeno, mas o elemento `input` continuava ocupando a largura inteira da linha por causa do CSS legado de campos de texto. O sintoma visual era o marcador centralizado e o texto empurrado para a direita. Portanto o critério de correção não é apenas o diâmetro visível; a caixa do próprio `input` precisa estar efetivamente limitada a 18 × 18 px.\n\nComo uma atualização de CSS pode ficar mascarada por cache antigo do navegador, os renderers público, editor e admin versionam seus assets com a versão instalada (`deploy-info.json`). Invariantes visuais críticos são implementados no proprietário CSS canônico, com escopo semântico e sem `!important`; CSS inline visual em shells não é um mecanismo aceito de precedência.'''
          if old not in text:
              raise SystemExit('canonical checkbox/inline CSS paragraph not found')
          text=text.replace(old,new,1)
          old2='''- Regras visuais controláveis pelo usuário não usam `!important`. O uso de `!important` fica restrito a invariantes funcionais deliberados, como o honeypot.'''
          new2='''- Nenhum CSS autoral versionado usa `!important`, inclusive invariantes funcionais. Geometria, acessibilidade, segurança e estado devem ser resolvidos por DOM, escopo, seletor e proprietário canônico; `!important` não é ferramenta de precedência aceita no projeto.'''
          if old2 not in text:
              raise SystemExit('legacy !important exception not found')
          text=text.replace(old2,new2,1)
          marker='''### Identidade de cache das derivadas de imagem'''
          architecture='''### Arquitetura CSS canônica\n\nO saneamento estrutural de 28/09/2026 substitui a antiga cascata cronológica por autoridades explícitas. A especificação completa está em `docs/CSS_SYSTEM_SANITIZATION_2026-09-28.md`.\n\n- `assets/ui-core.css` contém primitivas compartilhadas.\n- `assets/admin-system.css` é a autoridade global da administração; `assets/admin-media.css` é feature CSS consumida apenas pela mídia.\n- `assets/student-area.css` é a autoridade da área do aluno.\n- `template/page.css`, `assets/cms-core.css`, `assets/cms-editorial.css` e as features públicas explícitas compõem o CMS dentro de `cms-system`.\n- `editor/editor-system.css` é a autoridade do shell do editor; folhas adicionais só permanecem para features reais.\n- Folhas de correção cronológica (`v2`, `v3`, `fix`, `hotfix`, `override`, `refinement` e equivalentes) são proibidas.\n- `tools/test-css-architecture.php` bloqueia `!important`, autoridades aposentadas e regressões de carregamento.\n- `tools/audit-css-ownership.php --strict` bloqueia redefinição da mesma propriedade no mesmo seletor e contexto de cascata. `tools/consolidate-css-ownership.php --check` bloqueia consolidações determinísticas pendentes.\n\n'''
          if marker not in text:
              raise SystemExit('insertion marker not found')
          text=text.replace(marker,architecture+marker,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit canonical state and remove one-time workflow
        run: |
          git rm .github/workflows/css-state-doc-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md
          git commit -m 'Reconcile canonical CSS project state'
          git push origin HEAD:refactor/css-system-sanitization-2026-09-28
