name: css-selector-fixed-point-once
on:
  push:
    branches:
      - refactor/css-system-sanitization-2026-09-28
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-system-sanitization-2026-09-28
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Reach CSS selector ownership fixed point
        run: |
          php tools/consolidate-css-selectors.php
          php tools/consolidate-css-ownership.php
      - name: Commit cleanup and remove one-time workflow
        run: |
          git rm .github/workflows/css-selector-fixed-point-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.css'
          git commit -m 'Reach CSS selector ownership fixed point'
          git push origin HEAD:refactor/css-system-sanitization-2026-09-28
