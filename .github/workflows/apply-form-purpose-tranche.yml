name: Apply form purpose authority tranche

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patcher
        run: python3 tools/apply_form_purpose_tranche.py
      - name: Harden generated files
        run: python3 tools/fix_form_purpose_generated.py
      - name: Validate regression
        run: php tools/test-form-purpose-enrollment-authority.php
      - name: Validate PHP syntax
        run: |
          php -l app/form_purpose.php
          php -l app/student_accounts.php
          php -l app/student_lifecycle.php
          php -l admin/forms.php
          php -l admin/submissions.php
          php -l app/workshop_cms_setup.php
          php -l migrations/069_form_purpose_authority.php
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make form purpose the enrollment authority"
          git push origin HEAD:audit/form-purpose-enrollment-authority-2026-09-26
