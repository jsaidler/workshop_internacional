name: Apply form purpose authority tranche
on:
  push:
    branches: [audit/form-purpose-enrollment-authority-2026-09-26]
    paths: [.github/workflows/apply-form-purpose-tranche.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/form-purpose-enrollment-authority-2026-09-26
          fetch-depth: 0
      - name: Apply tranche
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root=Path('.')
          def read(p): return (root/p).read_text()
          def write(p,s):
              p=root/p; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(s)
          def b64(p,s): write(p,base64.b64decode(s).decode())
          FP=''
          MIG=''
          TEST=''
          DOC=''
          b64(Path('app/form_purpose.php'),FP); b64(Path('migrations/069_form_purpose_authority.php'),MIG); b64(Path('tools/test-form-purpose-enrollment-authority.php'),TEST); b64(Path('docs/FORM_PURPOSE_ENROLLMENT_AUTHORITY_2026-09-26.md'),DOC)
          p=Path('app/bootstrap.php'); t=read(p); a="'cms_forms','form_workflow','cms_pages'"; assert a in t; write(p,t.replace(a,"'cms_forms','form_purpose','form_workflow','cms_pages'",1))
          p=Path('app/student_accounts.php'); t=read(p); assert t.count("f.form_key='registration'")>=2; write(p,t.replace("f.form_key='registration'","f.purpose='enrollment'"))
          p=Path('app/student_lifecycle.php'); t=read(p); t=t.replace('SELECT s.id,f.form_key FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.id=? AND s.activity_id=?','SELECT s.id,f.purpose FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.id=? AND s.activity_id=?'); t=t.replace("if((string)$submission['form_key']!=='registration')throw new RuntimeException('Este registro não é uma inscrição de curso.');","if(cms_form_purpose($submission)!=='enrollment')throw new RuntimeException('Este registro não gera matrícula de curso.');"); assert "form_key']!=='registration" not in t; write(p,t)
          p=Path('admin/submissions.php'); t=read(p); t=t.replace('SELECT s.*,f.form_key FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.id=? AND s.activity_id=?','SELECT s.*,f.form_key,f.purpose FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.id=? AND s.activity_id=?'); t=t.replace('SELECT s.*,f.title form_title,f.form_key,f.locale form_locale FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.activity_id=?','SELECT s.*,f.title form_title,f.form_key,f.purpose,f.locale form_locale FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.activity_id=?'); t=t.replace('SELECT s.*,f.title form_title,f.form_key,f.locale form_locale FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.id=? AND s.activity_id=?','SELECT s.*,f.title form_title,f.form_key,f.purpose,f.locale form_locale FROM cms_form_submissions s JOIN cms_forms f ON f.id=s.form_id WHERE s.id=? AND s.activity_id=?'); t=t.replace("if($row['form_key']==='registration'){","if(cms_form_purpose($row)==='enrollment'){"); t=t.replace("$isRegistration=$row['form_key']==='registration'","$isRegistration=cms_form_purpose($row)==='enrollment'"); t=t.replace("$isRegistration=$selected['form_key']==='registration'","$isRegistration=cms_form_purpose($selected)==='enrollment'"); assert "form_key']==='registration" not in t; write(p,t)
          p=Path('app/workshop_cms_setup.php'); t=read(p); a="$form=cms_form_by_key($db,$activityId,PUBLIC_LOCALE_PT_BR,'registration');\n    if(!$form)$form=cms_form_create($db,$activityId,PUBLIC_LOCALE_PT_BR,'Inscrição — nova turma','registration','registration');"; assert a in t; r=a+"\n    $form=cms_form_set_purpose($db,(int)$form['id'],'enrollment');\n    $interest=cms_form_by_key($db,$activityId,PUBLIC_LOCALE_EN,'interest');\n    if($interest)cms_form_set_purpose($db,(int)$interest['id'],'interest');"; write(p,t.replace(a,r,1))
          p=Path('admin/forms.php'); t=read(p); a="if($action==='create'){$form=cms_form_create($db,$activityId,(string)($_POST['locale']??PUBLIC_LOCALE_PT_BR),(string)($_POST['title']??'Novo formulário'),(string)($_POST['form_key']??'form'),(string)($_POST['kind']??'interest'));header('Location: /admin/forms.php?activity='.$activityId.'&form='.(int)$form['id']);exit;}"; assert a in t; r="if($action==='create'){$form=cms_form_create($db,$activityId,(string)($_POST['locale']??PUBLIC_LOCALE_PT_BR),(string)($_POST['title']??'Novo formulário'),(string)($_POST['form_key']??'form'),(string)($_POST['kind']??'interest'));$form=cms_form_set_purpose($db,(int)$form['id'],(string)($_POST['purpose']??'common'));header('Location: /admin/forms.php?activity='.$activityId.'&form='.(int)$form['id']);exit;}"; t=t.replace(a,r,1); a="if($action==='save-workflow'){"; assert a in t; r="if($action==='save-purpose'){\n            $redirectForm=(int)($_POST['form_id']??0);$form=cms_form_by_id($db,$redirectForm);if(!$form||(int)$form['activity_id']!==$activityId)throw new RuntimeException('form_not_found');\n            cms_form_set_purpose($db,$redirectForm,(string)($_POST['purpose']??'common'));$_SESSION['admin_notice']='Finalidade salva.';\n        }\n        if($action==='save-workflow'){"; t=t.replace(a,r,1); a="<?php if($selected&&$selected['status']!=='archived'):?>\n<section class=\"admin-editor-card\">"; assert a in t; r="<?php if($selected&&$selected['status']!=='archived'):?>\n<section class=\"admin-editor-card\"><div class=\"admin-editor-header\"><div><p class=\"admin-kicker\">Finalidade</p><h2>Responsabilidade do formulário</h2></div><p>A chave identifica o formulário. A finalidade define o fluxo operacional.</p></div><form method=\"post\" class=\"cms-settings-form\"><input type=\"hidden\" name=\"_csrf\" value=\"<?=h(csrf_token('cms-forms'))?>\"><input type=\"hidden\" name=\"action\" value=\"save-purpose\"><input type=\"hidden\" name=\"form_id\" value=\"<?=(int)$selected['id']?>\"><div class=\"form-grid two-columns\"><label>Finalidade<select name=\"purpose\"><?php foreach(['common'=>'Comum','interest'=>'Interesse','registration'=>'Inscrição','enrollment'=>'Inscrição que gera matrícula'] as $value=>$label):?><option value=\"<?=h($value)?>\"<?=cms_form_purpose($selected)===$value?' selected':''?>><?=h($label)?></option><?php endforeach;?></select></label><div><p class=\"admin-muted\"><strong>Inscrição que gera matrícula</strong> é a única finalidade que participa do lifecycle de conta, turma e acesso do aluno.</p></div></div><div class=\"dialog-actions\"><button class=\"admin-button\" type=\"submit\">Salvar finalidade</button></div></form></section>\n<section class=\"admin-editor-card\">"; t=t.replace(a,r,1); a='<label>Modelo inicial<select name="kind"><option value="registration">Inscrição</option><option value="interest">Pesquisa de interesse</option></select></label>'; assert a in t; t=t.replace(a,a+'<label>Finalidade<select name="purpose"><option value="common">Comum</option><option value="interest">Interesse</option><option value="registration">Inscrição</option><option value="enrollment">Inscrição que gera matrícula</option></select></label>',1); write(p,t)
          note="\n## Tranche 2026-09-26 — finalidade de formulário como autoridade operacional\n\nImplementada em `audit/form-purpose-enrollment-authority-2026-09-26`: `cms_forms.purpose` é a autoridade explícita para comum/interesse/inscrição/inscrição que gera matrícula. O comportamento de matrícula deixou de ser decidido por `form_key='registration'`; a migração 069 preserva todas as chaves, IDs, submissões e o comportamento do formulário legado por backfill para `enrollment`. A interface permanece em `Admin → Formulários`. Ver `docs/FORM_PURPOSE_ENROLLMENT_AUTHORITY_2026-09-26.md`.\n"
          for d in ['docs/PROJECT_STATE.md','docs/SYSTEM_WIDE_IMPLEMENTATION_2026-09-25.md','docs/SYSTEM_WIDE_AUDIT_2026-09-25.md']:
              p=Path(d); t=read(p); write(p,t if 'Tranche 2026-09-26 — finalidade de formulário como autoridade operacional' in t else t.rstrip()+"\n"+note)
          Path('.github/workflows/apply-form-purpose-tranche.yml').unlink()
          PY
          php tools/test-form-purpose-enrollment-authority.php
          for f in app/form_purpose.php app/student_accounts.php app/student_lifecycle.php admin/forms.php admin/submissions.php app/workshop_cms_setup.php migrations/069_form_purpose_authority.php; do php -l "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make form purpose the enrollment authority"
          git push origin HEAD:audit/form-purpose-enrollment-authority-2026-09-26
