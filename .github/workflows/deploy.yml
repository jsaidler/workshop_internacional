name: deploy

on:
  push:
    branches:
      - 'wip/form-response-refinement-2026-07-16'
      - 'cms-v3-professional'
      - 'cms-v3-professional-2'
      - 'cms-v3-professional-3'
      - 'cms-v3-professional-4'
      - 'cms-v3-professional-5'
      - 'cms-v3-professional-6'
      - 'cms-v3-professional-7'
      - 'cms-v3-professional-8'
      - 'cms-v3-professional-9'
      - 'cms-v3-professional-10'
      - 'cms-v3-professional-11'
      - 'cms-v3-professional-12'
  pull_request:
    branches:
      - 'wip/form-response-refinement-2026-07-16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, dom, mbstring, gd, imagick

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source
        run: |
          find . -path './dist' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          find assets editor admin -name '*.js' -print0 | xargs -0 -n1 node --check
          php tools/test-cms.php
          php tools/test-student-area.php
          php tools/test-cms-v3.php
          php tools/test-media-image-policy.php
          php tools/test-media-maintenance.php
          php tools/test-media-derivative-integrity.php
          php tools/test-png-derivative-delivery.php
          php tools/test-design-css-cascade.php
          php tools/test-page-seo-seed.php
          php tools/test-cms-professional-3.php
          php tools/test-update-service.php
          php tools/test-update-restore.php
          php tools/test-system-health.php
          php tools/test-cms-discovery.php
          php tools/test-refine-session-copy.php
          php tools/test-workshop-copy-refinements.php
          php tools/test-public-errors.php
          php tools/test-task-centric-admin.php
          php tools/test-admin-submissions-layout.php
          php tools/test-responsive-layout-contract.php
          php tools/test-content-structure-editor.php
          php tools/test-form-editor-integration.php
          php tools/test-media-list-service.php
          php tools/test-media-detail-interactive.php
          php tools/test-registration-google-form-parity.php
          php tools/test-registration-payment-migration.php
          php tools/test-registration-native-content.php
          php tools/test-registration-success-payment.php
          php tools/test-build-dist.php

      - name: Build production artifact
        run: |
          php tools/build-dist.php
          SOURCE_SHA="$GITHUB_SHA" php tools/write-deploy-manifest.php dist

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14

      - name: Publish production branch for admin updater
        if: github.ref_name == 'wip/form-response-refinement-2026-07-16'
        shell: bash
        run: |
          set -euo pipefail
          export TMP_PROD="$(mktemp -d)"
          cp -a dist/. "$TMP_PROD/"
          cd "$TMP_PROD"
          git init -b production-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Production dist ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin production-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
