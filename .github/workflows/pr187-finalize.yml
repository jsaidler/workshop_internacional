name: pr187-finalize-source
on:
  push:
    branches:
      - fix/free-lab-navigation-2026-10-03
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-lab-navigation-2026-10-03
          fetch-depth: 0
      - name: Apply final laboratory patch
        run: |
          cat tools/pr187-final.patch.part00 tools/pr187-final.patch.part01 tools/pr187-final.patch.part02 > /tmp/pr187-final.patch
          git apply --check /tmp/pr187-final.patch
          git apply /tmp/pr187-final.patch
          rm tools/pr187-final.patch.part00 tools/pr187-final.patch.part01 tools/pr187-final.patch.part02
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Concluir bancada livre e controles de agitação"
          git push origin HEAD:fix/free-lab-navigation-2026-10-03
