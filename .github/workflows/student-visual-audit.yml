name: student-visual-audit
on:
  pull_request:
    paths:
      - 'aluno/**'
      - 'app/admin_course_agenda_cohort.php'
      - 'tools/browser-fixture/admin-course-agenda.php'
      - 'tools/browser-tests/admin-course-agenda.spec.cjs'
      - 'admin/processes.php'
      - 'admin/lab-catalogs.php'
      - 'app/student_*.php'
      - 'app/admin_shell.php'
      - 'assets/student-*.css'
      - 'assets/student-*.js'
      - 'assets/admin-*.css'
      - 'assets/cms-student-notes.css'
      - 'assets/ui-core.css'
      - 'assets/ui-core.js'
      - 'migrations/085_aula3_student_area_research_guide.php'
      - 'migrations/087_aula2_practice_bridge.php'
      - 'migrations/088_aula3_hires_screenshot_media.php'
      - 'migrations/089_restore_study_material_pedagogical_pattern.php'
      - 'migrations/assets/aula3-hires.pack.b64'
      - 'package.json'
      - 'tools/generate-aula3-screenshot-pack.cjs'
