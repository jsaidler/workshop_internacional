      - 'tools/browser-fixture/student-auth-visual-audit.html'
      - 'tools/browser-fixture/student-tools-current-audit.html'
      - 'tools/browser-fixture/student-tools-mechanics-audit.html'
      - 'tools/browser-fixture/student-process-product-audit.html'
      - 'tools/browser-fixture/student-process-routes-audit.html'
      - 'tools/browser-fixture/student-process-execution-state-audit.html'
      - 'tools/browser-fixture/admin-process-domain-audit.html'
      - 'tools/browser-fixture/student-caderno-product-audit.html'
      - 'tools/browser-fixture/student-caderno-product-audit.php'
      - 'tools/browser-fixture/student-caderno-product-audit.template.html'
      - 'tools/browser-fixture/student-lab-stock-product-audit.html'
      - 'tools/browser-fixture/student-secondary-screens-audit.html'
      - 'tools/browser-fixture/student-material-notes.html'
      - 'tools/browser-fixture/student-notebook-compare.html'
      - 'tools/browser-fixture/student-pedagogical-feedback-audit.html'
      - 'tools/browser-tests/student-aula3-material-audit.spec.cjs'
      - 'tools/browser-tests/student-visual-audit.spec.cjs'
      - 'tools/browser-tests/student-tools-current-audit.spec.cjs'
      - 'tools/browser-tests/student-tools-mechanics-audit.spec.cjs'
      - 'tools/browser-tests/student-process-product-audit.spec.cjs'
      - 'tools/browser-tests/student-process-routes-audit.spec.cjs'
      - 'tools/browser-tests/student-process-execution-state-audit.spec.cjs'
      - 'tools/browser-tests/admin-process-domain-audit.spec.cjs'
      - 'tools/browser-tests/student-material-notes-audit.spec.cjs'
      - 'tools/browser-tests/student-caderno-product-audit.spec.cjs'
      - 'tools/browser-tests/student-lab-stock-product-audit.spec.cjs'
      - 'tools/browser-fixture/student-inventory-create-recovery.php'
      - 'tools/browser-tests/student-inventory-create-recovery.spec.cjs'
      - 'tools/browser-tests/student-inventory-item-direct.spec.cjs'
      - 'tools/browser-fixture/student-inventory-movement.php'
      - 'tools/browser-tests/student-inventory-movement.spec.cjs'
      - 'tools/browser-fixture/student-long-editors.php'
      - 'tools/browser-tests/student-long-editors.spec.cjs'
      - 'tools/browser-fixture/student-record-workspace.php'
      - 'tools/browser-tests/student-record-workspace.spec.cjs'
      - 'tools/browser-fixture/student-process-step-editor.php'
      - 'tools/browser-tests/student-process-step-editor.spec.cjs'
      - 'tools/browser-fixture/student-profile.php'
      - 'tools/browser-tests/student-profile.spec.cjs'
      - 'tools/test-student-profile-view.php'
      - 'app/student_profile_view.php'
      - 'tools/test-student-process-step-editor.php'
      - 'app/student_process_template_step_editor.php'
      - 'app/student_record_workspace_navigation.php'
      - 'tools/test-student-record-workspace.php'
      - 'app/student_preparation_editor.php'
      - 'app/student_calibration_editor.php'
      - 'tools/test-student-long-editors.php'
      - 'app/student_inventory_move_panel.php'
      - 'tools/test-student-inventory-movement.php'
      - 'tools/browser-fixture/student-inventory-item-direct.php'
      - 'tools/test-student-inventory-item-direct.php'
      - 'app/student_inventory_item_editor.php'
      - 'tools/test-student-inventory-create-recovery.php'
      - 'tools/browser-tests/student-complete-area-audit.spec.cjs'
      - 'tools/browser-tests/student-cross-route-journeys.spec.cjs'
      - 'tools/browser-fixture/student-toolbox-real-audit.php'
      - 'tools/browser-tests/student-toolbox-real-audit.spec.cjs'
      - 'tools/test-student-toolbox-parity.php'
      - 'tools/browser-tests/student-gallery-upload.spec.cjs'
      - 'tools/browser-tests/student-record-create-sheet.spec.cjs'
      - 'tools/browser-fixture/student-record-create-sheet.php'
      - 'app/student_record_create_dialog.php'
      - 'tools/browser-fixture/student-record-gallery.php'
      - '.github/workflows/student-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Render student and process-admin surfaces
        run: |
          php -S 127.0.0.1:8099 -t . >/tmp/student-visual-audit.log 2>&1 &
          PHP_SERVER_PID=$!
          trap 'kill $PHP_SERVER_PID' EXIT
          sleep 1
          npx playwright test tools/browser-tests/student-visual-audit.spec.cjs tools/browser-tests/student-tools-current-audit.spec.cjs tools/browser-tests/student-tools-mechanics-audit.spec.cjs tools/browser-tests/student-process-product-audit.spec.cjs tools/browser-tests/student-process-routes-audit.spec.cjs tools/browser-tests/student-process-execution-state-audit.spec.cjs tools/browser-tests/admin-process-domain-audit.spec.cjs tools/browser-tests/student-material-notes-audit.spec.cjs tools/browser-tests/student-caderno-product-audit.spec.cjs tools/browser-tests/student-lab-stock-product-audit.spec.cjs tools/browser-tests/student-complete-area-audit.spec.cjs --workers=1
          node tools/generate-aula3-screenshot-pack.cjs student-visual-audit/complete/desktop migrations/assets/aula3-hires.pack.b64
          npx playwright test tools/browser-tests/student-cross-route-journeys.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-aula3-material-audit.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-gallery-upload.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-inventory-create-recovery.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-inventory-item-direct.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-inventory-movement.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-long-editors.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-record-workspace.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-process-step-editor.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-profile.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-agenda.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-home-operational.spec.cjs --workers=1
          npx playwright test tools/browser-tests/admin-course-agenda.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-toolbox-real-audit.spec.cjs --workers=1
          npx playwright test tools/browser-tests/student-record-create-sheet.spec.cjs --workers=1
      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-visual-audit-${{ github.sha }}
          path: student-visual-audit
          if-no-files-found: error
