name: admin-product-repair-batch

on:
  push:
    branches:
      - 'ux/admin-complete-product-repair-2026-10-03'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/admin-complete-product-repair-2026-10-03
          fetch-depth: 0
      - name: Apply administrative product repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/tests.php')
          s=p.read_text(encoding='utf-8')
          old="if($cohortId>0&&!$cohort)$cohortId=0;"
          new="if($cohortId>0&&!$cohort){$cohortId=0;}"
          if old not in s:
              raise SystemExit('tests cohort guard normalization target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 .admin-product-repair.py
          rm -f .admin-product-repair.py
          rm -f .github/workflows/admin-product-repair-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete admin navigation and responsive workflow repair'
          git push origin HEAD:ux/admin-complete-product-repair-2026-10-03
