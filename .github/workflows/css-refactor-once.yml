name: css-refactor-once
on:
  push:
    branches:
      - 'refactor/css-system-sanitization-2026-09-28'
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-system-sanitization-2026-09-28
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply CSS architecture migration
        run: php tools/refactor-css-system.php
      - name: Remove one-shot migration machinery
        run: rm .github/workflows/css-refactor-once.yml tools/refactor-css-system.php
      - name: Commit migrated CSS architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate CSS ownership across system'
          git push origin HEAD:refactor/css-system-sanitization-2026-09-28
