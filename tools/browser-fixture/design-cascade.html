<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Design cascade fixture</title></head>
<body>
<form id="cms-design-form">
  <select name="type[bodyFont]" data-design-font-role="body">
    <option value="IBM Plex Sans" data-font-stack='"IBM Plex Sans", Arial, sans-serif' data-font-weights="300;400;500;600" selected>IBM Plex Sans</option>
    <option value="Inter" data-font-stack='"Inter", Arial, sans-serif' data-font-weights="300;400;500;600;700">Inter</option>
  </select>
  <select name="type[displayFont]" data-design-font-role="display">
    <option value="Saira Extra Condensed" data-font-stack='"Saira Extra Condensed", "Arial Narrow", Arial, sans-serif' data-font-weights="300;400;500;600;700" selected>Saira Extra Condensed</option>
    <option value="Oswald" data-font-stack='"Oswald", "Arial Narrow", Arial, sans-serif' data-font-weights="300;400;500;600;700">Oswald</option>
  </select>
  <select name="type[monoFont]" data-design-font-role="mono">
    <option value="IBM Plex Mono" data-font-stack='"IBM Plex Mono", Consolas, monospace' data-font-weights="300;400;500;600" selected>IBM Plex Mono</option>
    <option value="Roboto Mono" data-font-stack='"Roboto Mono", Consolas, monospace' data-font-weights="300;400;500;600;700">Roboto Mono</option>
  </select>
  <input name="type[bodySize]" value="17">
  <textarea name="advanced[customCss]">:root{--cms-body-size:31px}div{font-weight:400}</textarea>
</form>
<div id="design-preview-device">
  <iframe id="design-preview-frame" title="Prévia" srcdoc='<!doctype html><html><head><style id="fixture-base">@layer cms-system{:root{--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:monospace}body{font-family:var(--body);font-size:var(--cms-body-size,13px)}html body #probe{font-family:var(--title);font-weight:900}#mono{font-family:var(--mono)}}</style></head><body><div id="probe">probe</div><span id="mono">mono</span></body></html>'></iframe>
</div>
<script src="/assets/design-admin.js"></script>
</body>
</html>
