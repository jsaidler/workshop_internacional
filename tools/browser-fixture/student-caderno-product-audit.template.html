<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark" href="/aluno/">JSaidler Fotografia</a><nav class="student-desktop-nav" aria-label="Área do aluno"><a href="/aluno/">Início</a><a href="/aluno/cursos.php">Cursos</a><a href="/aluno/caderno.php" aria-current="page">Caderno</a><a href="/aluno/ferramentas.php">Laboratório</a></nav><span class="student-topbar-spacer"></span><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav" aria-label="Área do aluno"><a href="/aluno/">Início</a><a href="/aluno/cursos.php">Cursos</a><a href="/aluno/caderno.php" aria-current="page">Caderno</a><a href="/aluno/ferramentas.php">Laboratório</a></nav>
</div>
<script>
const recordHeader=`<header class="student-record-header"><div class="student-record-context"><a class="student-back">← Caderno</a><span class="student-status">Rascunho</span></div><p class="student-kicker">Positivo Direto · Turma setembro</p><h1 class="student-title student-title-record">Teste EI 200 — FeCl₃</h1><p class="student-record-purpose">Este é um registro único. Exposição, processamento e resultado podem ser preenchidos, corrigidos ou deixados em aberto independentemente.</p><nav class="student-actions student-record-section-links"><a class="button button-secondary button-compact" href="#exposicao">Exposição</a><a class="button button-secondary button-compact" href="#processamento">Processamento</a><a class="button button-secondary button-compact" href="#resultado">Resultado</a></nav></header>`;
const exposure=(filled=true,optionsOpen=false)=>`<section class="student-section student-record-section" id="exposicao"><div class="student-workflow-heading"><div><p class="student-kicker">Exposição</p><h2 class="student-subtitle">Como expus</h2></div><p>Registre ou corrija o que quiser documentar sobre a exposição.</p></div><form class="student-mobile-form student-record-form"><div class="student-capture-block"><div><span class="student-capture-number">A</span><div><h3>Referência da cena</h3><p>Opcional.</p></div></div>__STUDENT_MEDIA_SCENE__</div><div class="student-form-group"><h3>Dados da exposição</h3><div class="student-form-grid"><label class="form-field student-span-2">Título<input value="Teste EI 200 — FeCl₃"></label><label class="form-field">Data<input type="date" value="2026-10-01"></label><label class="form-field">Filme<input value="${filled?'Fuji Super H-RU':''}"></label><label class="form-field">EI<input value="${filled?'200':''}"></label><label class="form-field">Abertura<input value="${filled?'f/64':''}"></label><label class="form-field">Tempo sem reciprocidade<input value="${filled?'4 s':''}"></label><label class="form-field">Tempo com reciprocidade<input value="${filled?'7 s':''}" readonly></label><details class="student-optional-fields student-span-2"${optionsOpen?' open':''}><summary>Dados opcionais</summary><div class="student-form-grid"><label class="form-field">Lote<input value=""></label><label class="form-field student-span-2">Condição de luz<textarea rows="2"></textarea></label><label class="form-field student-span-2">Faixa tonal e intenção<textarea rows="2"></textarea></label></div></details></div></div><div class="student-actions"><button class="button button-primary">Salvar exposição</button></div></form></section>`;
const emptyProcess=(freeOpen=false)=>`<section class="student-workflow-panel student-record-section" id="processamento"><div class="student-workflow-heading"><div><p class="student-kicker">Processamento</p><h2 class="student-subtitle">Roteiro e etapas</h2></div><p>Associe um roteiro como referência ou anote etapas livremente.</p></div><div class="student-process-path-choice"><div class="student-actions"><a class="button button-primary">Associar roteiro</a><a class="button button-secondary">Movimentar estoque</a></div></div><details class="student-manual-process"${freeOpen?' open':''}><summary><span><strong>Adicionar etapa</strong><small>Anote uma etapa sem associar um roteiro.</small></span><span>＋</span></summary><form class="student-process-step-form student-form-grid"><label class="form-field student-span-2">Tipo de etapa<select><option>Primeira revelação</option></select></label><label class="form-field student-span-2">Nome personalizado <small>use se escolher “Outra etapa”</small><input></label><label class="form-field student-span-2">Químico ou solução <small>opcional</small><input></label><label class="form-field">Tempo<input placeholder="07:00"></label><label class="form-field">Temperatura<input placeholder="26 °C"></label><label class="form-field student-span-2">Agitação<input></label><label class="form-field student-span-2">Anotações<textarea rows="3"></textarea></label><div class="student-actions student-span-2"><button class="button button-primary">Adicionar ao registro</button></div></form></details></section>`;
const routeEditor=`<div class="student-notebook-route-editor"><form class="student-form-grid"><label class="form-field student-span-2">Nome da etapa<input value="Primeira revelação"></label><label class="form-field">Tempo<input value="07:00"></label><label class="form-field">Temperatura<input value="26 °C"></label><label class="form-field student-span-2">Revelador / solução<input value="Parodinal"></label><label class="form-field">Revelador / solução (ml)<input value="20"></label><label class="form-field">Água (ml)<input value="530"></label><label class="form-field student-span-2">Agitação<select><option>Sem temporização</option></select></label><label class="form-field">Duração da agitação<input></label><label class="form-field">Intervalo entre inícios<input></label><label class="form-field student-span-2">Observação de agitação<input value="leve"></label><label class="form-field student-span-2">Anotações<textarea rows="3"></textarea></label><div class="student-actions student-span-2"><button class="button button-primary">Salvar etapa</button><a class="button button-secondary">Fechar</a></div></form><div class="student-notebook-route-order"><button class="student-link">↓ Descer</button></div></div>`;
const routeSteps=(partial=false,editing=false)=>[
 ['Primeira revelação','07:00',partial],['Lavagem','01:00',false],['Branqueamento','05:00',partial],['Lavagem após branqueamento','01:00',false],['Limpeza','01:30',partial],['Segunda exposição','',false],['Segunda revelação','07:00',partial],['Lavagem final','01:00',false],['Secagem','',partial]
].map(([label,time,done],i)=>`<article class="student-notebook-route-step ${done?'is-done':''}${editing&&i===0?' is-editing':''}"><div class="student-notebook-route-step-main"><span class="student-process-step-number">${String(i+1).padStart(2,'0')}</span><strong>${label}</strong>${time?`<small>${time}</small>`:''}</div><div class="student-actions student-notebook-route-step-actions"><button class="button button-secondary button-compact">${done?'Desmarcar':'Marcar ✓'}</button><a class="button button-secondary button-compact">Editar</a><a class="button button-secondary button-compact">${time?'Timer':'Abrir etapa'}</a></div>${editing&&i===0?routeEditor:''}</article>`).join('');
const processPlan=(partial=false,editing=false)=>`<section class="student-workflow-panel student-record-section" id="processamento"><div class="student-workflow-heading"><div><p class="student-kicker">Processamento</p><h2 class="student-subtitle">Roteiro e etapas</h2></div><p>O roteiro é uma referência. Marque, edite ou abra qualquer etapa na ordem que quiser.</p></div><section class="student-caderno-plan-card"><div class="student-caderno-plan-head"><div><p class="student-kicker">Roteiro associado</p><h3>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h3><p>Esta é a cópia deste registro. Alterações feitas aqui não mudam o roteiro-modelo.</p></div><span class="student-plan-progress">${partial?'5':'0'} de 9 marcadas</span></div><div class="student-notebook-route-steps">${routeSteps(partial,editing)}</div><details class="student-notebook-route-add"><summary><span><strong>Adicionar etapa ao roteiro</strong><small>Altera somente a cópia deste registro.</small></span><span>＋</span></summary></details><div class="student-actions student-plan-resume-actions"><a class="button button-primary">Abrir roteiro</a><a class="button button-secondary">Trocar roteiro-base</a><a class="button button-secondary">Movimentar estoque</a></div></section></section>`;
const result=(filled=false,hasPlan=true,summaryOpen=false)=>`<section class="student-section student-record-section" id="resultado"><div class="student-workflow-heading"><div><p class="student-kicker">Resultado</p><h2 class="student-subtitle">O que obtive</h2></div><p>Registre o resultado quando quiser. Ele não depende de nenhuma etapa anterior.</p></div><details class="student-result-context"${summaryOpen?' open':''}><summary><span>Resumo do registro</span><small>Exposição e processamento</small></summary><div class="student-result-context-grid"><article><span>Exposição</span><dl><div><dt>Filme</dt><dd>${hasPlan||filled?'Fuji Super H-RU':'—'}</dd></div><div><dt>EI</dt><dd>${hasPlan||filled?'200':'—'}</dd></div></dl><a>Ir para exposição</a></article><article><span>Processamento</span>${hasPlan?`<dl><div><dt>Roteiro</dt><dd>FeCl₃ + amônia</dd></div><div><dt>Etapas marcadas</dt><dd>${filled?'5 de 9':'0 de 9'}</dd></div></dl>`:'<p>Nenhuma etapa anotada.</p>'}<a>Ir para processamento</a></article></div></details><div class="student-result-flow"><form class="student-mobile-form student-result-form"><div class="student-capture-block"><div><span class="student-capture-number">B</span><div><h3>Imagem do resultado</h3><p>Fotografia da chapa processada ou outra evidência.</p></div></div>__STUDENT_MEDIA_RESULT__</div><label class="form-field">Anotações sobre o resultado<textarea rows="5">${filled?'Sombras agrupadas; tentativa encerrada após a primeira revelação.':''}</textarea></label><p class="student-field-help">Inclusive quando a experiência foi abandonada antes do fim do roteiro.</p><div class="student-actions"><button class="button button-primary">Salvar resultado</button></div></form></div></section>`;
const record=(process,filledExposure=true,filledResult=false,hasPlan=true,optionsOpen=false,summaryOpen=false)=>`${recordHeader}${exposure(filledExposure,optionsOpen)}${process}${result(filledResult,hasPlan,summaryOpen)}<div class="student-actions student-record-footer-actions"><a class="button button-secondary">← Voltar ao Caderno</a></div>`;
const card=({label,title,lines,date,status})=>`<article class="student-process-card student-notebook-card"><a class="student-process-card-main"><div class="student-notebook-card-copy"><span class="student-card-label">${label}</span><h3>${title}</h3><div class="student-record-summary">${lines.map(line=>`<span>${line}</span>`).join('')}</div></div><div class="student-process-card-state"><strong>Abrir registro →</strong><span>${date}</span></div></a><div class="student-process-card-footer"><span class="student-status">${status}</span><details class="student-record-menu"><summary>Mais ações</summary></details></div></article>`;
const notebookCards=[card({label:'Positivo Direto · Turma setembro',title:'Teste EI 200 — FeCl₃',lines:['Exposição registrada','Roteiro associado · 3 etapas marcadas','Resultado ainda não registrado'],date:'01/10/2026<br>Atualizado hoje',status:'Privado'}),card({label:'Pessoal',title:'EI 400 — peracética',lines:['Exposição registrada','7 etapas marcadas','Resultado registrado'],date:'30/09/2026<br>Atualizado ontem',status:'Pessoal'}),card({label:'Positivo Direto · Estudos',title:'EI 400 — Brewed Caffenol',lines:['Exposição registrada','Sem roteiro associado','Resultado registrado'],date:'27/09/2026<br>Atualizado há 5 dias',status:'Privado'})].join('');
const routePicker=`<header class="student-page-heading student-process-library-heading"><div><a class="student-back">← Voltar ao registro</a><p class="student-kicker">Processamento · Teste EI 200 — FeCl₃</p><h1 class="student-title">Alterar roteiro</h1><p class="student-process-context">Escolha a referência que quer manter neste registro. Associar um roteiro não inicia processamento, não impõe ordem e não movimenta estoque.</p></div></header><section class="student-section"><div class="student-section-heading"><div><p class="student-kicker">Roteiro atual</p><h2 class="student-subtitle">Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h2></div><p>5 de 9 etapas marcadas. Anotações permanecem; marcações compatíveis podem ser preservadas.</p></div></section><section class="student-process-section"><div class="student-process-section-heading"><div><p class="student-kicker">Sua biblioteca</p><h2 class="student-subtitle">Meus processamentos</h2></div></div><div class="student-process-library"><article class="student-process-template-card"><div class="student-process-template-main"><span class="student-process-step-number">09</span><div><h3>FeCl₃ mais curto</h3><p>Roteiro pessoal.</p><div class="student-process-summary"><span>9 etapas</span><span>18 min</span></div></div></div><div class="student-process-template-actions"><button class="button button-primary button-compact">Associar este roteiro</button></div></article></div></section><section class="student-process-section student-process-standards"><div class="student-process-section-heading"><div><p class="student-kicker">Padrões do workshop</p><h2 class="student-subtitle">Roteiros conhecidos</h2></div></div><div class="student-process-standard-grid"><article class="student-process-standard-card"><div class="student-process-standard-meta"><span>EI 200</span><span>Parodinal</span><span>Peracética</span></div><h3>Positivo direto — EI 200 — peracética</h3><p>Roteiro padrão.</p><div class="student-process-standard-footer"><span>9 etapas · 20 min</span><button class="button button-primary button-compact">Associar este roteiro</button></div></article></div></section><div class="student-actions"><a class="button button-secondary">Cancelar e voltar ao registro</a></div>`;
const screens={notebook:`<div class="student-page-heading student-notebook-heading"><div><p class="student-kicker">Caderno</p><h1 class="student-title">Caderno de Processos</h1><p class="student-notebook-intro">Cada registro reúne o que você quiser documentar. As partes podem ser preenchidas em qualquer ordem e retomadas depois.</p></div><button class="button button-primary">Novo registro</button></div><section class="student-section student-notebook-records"><div class="student-section-heading student-notebook-section-heading"><div><p class="student-kicker">Seus registros</p><h2 class="student-subtitle">3 registros</h2></div></div><div class="student-process-list student-notebook-list">${notebookCards}</div></section>`,'record-empty':record(emptyProcess(false),false,false,false),'record-options':record(emptyProcess(false),false,false,false,true,false),'record-free-step':record(emptyProcess(true),false,false,false),'record-plan':record(processPlan(false,false),true,false),'record-plan-edit':record(processPlan(false,true),true,false),'record-partial':record(processPlan(true,false),true,false),'route-picker':routePicker,'record-result':record(processPlan(true),true,true),'record-result-context':record(processPlan(true),true,true,true,false,true)};
const params=new URLSearchParams(location.search);const screen=params.get('screen')||'notebook';if(screen==='route-picker'){for(const href of ['/assets/student-processes.css','/assets/student-process-replanning.css']){const link=document.createElement('link');link.rel='stylesheet';link.href=href;document.head.appendChild(link);}}document.getElementById('screen').innerHTML=screens[screen];
</script>
<script defer src="/assets/student-experience.js"></script></body></html>
