const applyQuestionFailureState=(key,state)=>{
 if((key==='question-new'&&state!=='failed-create')||(key==='question-thread'&&state!=='failed-reply'))return;
 const root=document.getElementById('screen'),alert=document.createElement('p');alert.className='ui-alert ui-alert-error';alert.setAttribute('role','alert');
 alert.textContent=key==='question-new'?'Não foi possível publicar a dúvida. Revise os dados e tente novamente.':'Não foi possível enviar a resposta. O texto foi mantido.';
 root.prepend(alert);
 if(key==='question-new'){
   const panel=root.querySelector('[data-question-new-panel]'),trigger=root.querySelector('[data-question-new-toggle]'),form=panel.querySelector('form');
   panel.hidden=false;trigger.setAttribute('aria-expanded','true');
   form.querySelector('[name="topic"]').value='Química';
   const record=document.createElement('option');record.value='23';record.textContent='Registro do banho de amônia';record.selected=true;form.querySelector('[name="test_id"]').append(record);
   form.querySelector('[name="title"]').value='Dúvida sobre o banho';
   form.querySelector('[name="body"]').value='Meu rascunho sobre diluição e amônia precisa permanecer no formulário.';
   form.querySelector('[name="visibility"][value="course"]').checked=true;
 }else{
   root.querySelector('[name="body"]').value='Minha resposta sobre segunda revelação continua aqui após a falha.';
 }
};
const expandQuestionAuditStates=(key,state)=>{
 const root=document.getElementById('screen');
 if(key==='questions-list'){
   // Mirror the complete form and its control tree; only the volume of data is synthetic.
   const source=document.createElement('div');source.innerHTML=screens['question-new'];
   const editor=source.querySelector('[data-question-new-panel]');
   editor.hidden=true;
   root.querySelector('.student-page-heading').after(editor);
   const list=root.querySelector('.student-test-list');
   const row=list?.querySelector('.student-test-row');
   if(state==='empty'){
     list.replaceWith(Object.assign(document.createElement('div'),{className:'student-empty',textContent:'Ainda não há dúvidas nesta turma ou curso.'}));
   }else if(state==='many'){
     for(let n=0;n<28;n++){
       const copy=row.cloneNode(true);
       copy.querySelector('h3').textContent='Dúvida experimental longa '+String(n+1).padStart(2,'0');
       copy.querySelector('p').textContent='Aluno da turma · Revisão detalhada de uma sequência extensa de processamento e exposição';
       list.append(copy);
     }
   }else if(state==='evaluations'){
     const section=document.createElement('section');section.className='student-section student-evaluation-conversations';
     section.setAttribute('aria-labelledby','student-evaluation-conversations-title');
