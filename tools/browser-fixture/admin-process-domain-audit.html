<body class="admin-page admin-section-processes admin-workspace-laboratory"><div class="admin-frame">

<aside class="admin-sidebar" id="admin-navigation"><a class="admin-wordmark">JSaidler Fotografia<span class="admin-wordmark-context">Administração</span></a><div class="admin-site-current"><span>Site</span><strong>Workshop Internacional</strong></div><nav class="admin-nav"><section class="admin-nav-group"><p class="admin-nav-label">Principal</p><div class="admin-nav-links"><a>Visão geral</a></div></section><section class="admin-nav-group"><p class="admin-nav-label">Operação</p><div class="admin-nav-links"><a>Inscrições</a><a>Turmas</a><a>Alunos</a><a>Pessoas</a></div></section><section class="admin-nav-group"><p class="admin-nav-label">Ensino</p><div class="admin-nav-links"><a>Cursos</a><a>Aulas</a><a>Material</a></div></section><section class="admin-nav-group"><p class="admin-nav-label">Laboratório</p><div class="admin-nav-links"><a data-nav-processes aria-current="page">Processos globais</a><a data-nav-catalogs>Catálogos do laboratório</a></div></section><section class="admin-nav-group"><p class="admin-nav-label">Site</p><div class="admin-nav-links"><a>Páginas</a><a>Formulários</a></div></section></nav></aside>
<main class="admin-main"><header class="admin-toolbar"><div class="admin-toolbar-title"><h1 id="page-title">Processos globais</h1><p>Workshop Internacional</p></div></header><div class="admin-content" id="screen"></div></main></div>
<script>
const processes=[
['Positivo direto — Parodinal EI 200 — FeCl₃ + amônia','positive-ferric-ammonia-ei200','v1','12'],
['Positivo direto — Parodinal EI 400 — FeCl₃ + amônia','positive-ferric-ammonia-ei400','v1','8'],
['Positivo direto — Parodinal EI 200 — peracética','positive-peracetic-ei200','v1','5'],
['Positivo direto — Parodinal EI 400 — peracética','positive-peracetic-ei400','v1','9'],
['Positivo direto — Brewed Caffenol EI 400 — FeCl₃ + amônia','positive-ferric-ammonia-ei400-caffenol','v1','3'],
['Positivo direto — Brewed Caffenol EI 400 — peracética','positive-peracetic-ei400-caffenol','v1','2']
];
const ferric=[
['01','Primeira revelação','Parodinal · 26 °C · 07:00'],['02','Lavagem com água','01:00'],['03','Cloreto férrico','01:30'],['04','Lavagem','01:00'],['05','Banho de amônia','Sem tempo'],['06','Lavagem','01:00'],['07','Segunda revelação','Parodinal · 26 °C · 07:00 · reutiliza 1ª revelação'],['08','Lavagem final','01:00'],['09','Secagem','Sem tempo']
];
const list=`<div class="admin-list-summary"><span>6 processos globais</span><span>Receitas publicadas são versionadas; uma alteração nunca modifica o histórico do aluno.</span></div><div class="admin-table-scroll"><table class="admin-data-table"><thead><tr><th>Processo</th><th>Status</th><th>Versão ativa</th><th>Uso</th><th></th></tr></thead><tbody>${processes.map(p=>`<tr><td><div class="admin-table-primary"><strong>${p[0]}</strong><span>${p[1]}</span></div></td><td><span class="admin-badge admin-badge--good">Ativo</span></td><td>${p[2]}</td><td>${p[3]} plano(s)</td><td><button class="admin-button secondary admin-table-action">Gerenciar</button></td></tr>`).join('')}</tbody></table></div><details class="admin-secondary-setup admin-process-create"><summary class="admin-button">Novo processo global</summary><section class="admin-card"><form class="admin-form-grid"><label class="admin-form-span-2">Nome<input></label><label class="admin-form-span-2">Chave estável<input></label><label class="admin-form-span-2">Descrição<textarea rows="3"></textarea></label><div class="admin-form-actions"><button class="admin-button">Criar rascunho</button></div></form></section></details>`;
const draftSteps=ferric.map((s,i)=>`<li class="admin-process-step"><div class="admin-process-step-summary"><span>${s[0]}</span><div><strong>${s[1]}</strong><small>${s[2]}</small></div><div class="admin-inline-actions"><button class="admin-button secondary admin-table-action" ${i===0?'disabled':''}>↑</button><button class="admin-button secondary admin-table-action" ${i===ferric.length-1?'disabled':''}>↓</button></div></div>${i===2?`<details open><summary>Editar etapa</summary><form class="admin-form-grid admin-process-step-form"><label class="admin-form-span-2">Etapa<select><option>Cloreto férrico</option></select></label><label>Revelador<select><option>—</option></select></label><label>Nome personalizado<input></label><label>Revelador / estoque (ml)<input></label><label>Água (ml)<input></label><label>Volume fresco (ml)<input></label><label>Temperatura<input value=""></label><label>Tempo<input value="1:30"></label><label>Intervalo de agitação<input></label><label class="admin-form-span-2">Agitação<input></label><label class="admin-form-span-2">Químico / nome livre<input value="Cloreto férrico"></label><label>Reutilizar banho<select><option>Não</option></select></label><label class="admin-form-span-2">Notas<textarea rows="3"></textarea></label><div class="admin-form-actions admin-form-span-2"><button class="admin-button">Salvar etapa</button></div></form><button class="admin-button danger">Remover etapa</button></details>`:''}</li>`).join('');
const draft=`<section class="admin-card admin-process-detail"><header><div><a class="admin-back">← Processos globais</a><p class="admin-kicker">Processo global</p><h2>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h2><p>Parodinal 10 ml + água até 550 ml, 26 °C, 7 min e agitação leve.</p><div class="admin-process-meta"><span class="admin-badge admin-badge--good">Ativo</span><span>Versão publicada v1</span></div></div><div class="admin-card-actions"><button class="admin-button secondary">Arquivar</button></div></header></section><section class="admin-card admin-process-editor"><header><div><p class="admin-kicker">Rascunho · v2</p><h2>Editar próxima versão</h2><p>Estas alterações não afetam alunos até a publicação e nunca reescrevem processos que já foram associados ou executados.</p></div></header><form class="admin-form-grid"><label class="admin-form-span-2">Nome<input value="Positivo direto — Parodinal EI 200 — FeCl₃ + amônia"></label><label class="admin-form-span-2">Descrição<textarea rows="3">Parodinal 10 ml + água até 550 ml, 26 °C, 7 min.</textarea></label><label class="admin-form-span-2">O que mudou nesta versão<textarea rows="2">Corrige a observação do branqueamento sem alterar execuções anteriores.</textarea></label><div class="admin-form-actions"><button class="admin-button">Salvar rascunho</button></div></form></section><section class="admin-card admin-process-steps"><header><div><p class="admin-kicker">Roteiro</p><h2>9 etapas</h2><p>A ordem e os parâmetros abaixo são a base do snapshot usado em novas associações depois da publicação.</p></div></header><ol class="admin-process-step-list">${draftSteps}</ol><details class="admin-secondary-setup admin-process-add"><summary class="admin-button secondary">Adicionar etapa</summary></details></section><section class="admin-card admin-process-publish"><header><div><p class="admin-kicker">Publicação</p><h2>Disponibilizar v2</h2><p>Novas associações usarão o novo roteiro; registros e execuções existentes continuam com o snapshot anterior.</p></div><button class="admin-button">Publicar nova versão</button></header></section>`;
const published=`<section class="admin-card admin-process-detail"><header><div><a class="admin-back">← Processos globais</a><p class="admin-kicker">Processo global</p><h2>Positivo direto — Parodinal EI 400 — peracética</h2><p>Parodinal 20 ml + água até 550 ml, 26 °C, 7 min.</p><div class="admin-process-meta"><span class="admin-badge admin-badge--good">Ativo</span><span>Versão publicada v3</span></div></div></header></section><section class="admin-card admin-process-version-start"><header><div><p class="admin-kicker">Alteração segura</p><h2>Criar uma nova versão</h2><p>A versão publicada continua imutável. Um novo rascunho só passa a valer para novas escolhas depois de publicado.</p></div><button class="admin-button">Criar rascunho</button></header></section><section class="admin-card admin-process-preview"><header><div><p class="admin-kicker">Versão em uso · v3</p><h2>Roteiro publicado</h2></div></header><ol class="admin-process-published-list">${ferric.slice(0,7).map(s=>`<li><span>${s[0]}</span><div><strong>${s[1]}</strong><small>${s[2]}</small></div></li>`).join('')}</ol></section><section class="admin-card admin-process-history"><header><div><p class="admin-kicker">Histórico</p><h2>Versões</h2></div></header><div class="admin-table-scroll"><table class="admin-data-table"><thead><tr><th>Versão</th><th>Status</th><th>Publicada</th><th>Alteração</th></tr></thead><tbody><tr><td>v3</td><td><span class="admin-badge admin-badge--good">published</span></td><td>02/10/2026 18:10</td><td>Corrige notas de uso</td></tr><tr><td>v2</td><td><span class="admin-badge admin-badge--muted">superseded</span></td><td>20/09/2026 14:30</td><td>Ajusta tempo do branqueamento</td></tr><tr><td>v1</td><td><span class="admin-badge admin-badge--muted">superseded</span></td><td>01/09/2026 12:00</td><td>Versão migrada</td></tr></tbody></table></div></section>`;
const stageRows=[['Primeira revelação','first_development','development','—','10',1],['Lavagem com água','wash_after_first','wash','—','20',1],['Banho interruptor','stop_after_first','chemical','Banho interruptor','30',0],['Fixação / hipossulfito','fixer','chemical','Hipossulfito / fixador','40',1],['Solução peroxiacética','peracetic','chemical','Solução peroxiacética','50',1],['Cloreto férrico','ferric','chemical','Cloreto férrico','60',1],['Dicromato','dichromate','chemical','Dicromato','70',0],['Permanganato','permanganate','chemical','Permanganato','80',0],['Lavagem','wash_after_bleach','wash','—','90',1],['Banho de amônia','ammonia','chemical','Amônia','100',1],['Lavagem','wash_after_ammonia','wash','—','110',1],['Banho de limpeza','clearing','chemical','Banho de limpeza','120',1],['Lavagem','wash_after_clearing','wash','—','130',1],['Segunda revelação','second_development','development','—','140',1],['Lavagem final','final_wash','wash','—','150',1],['Secagem','dry','dry','—','160',1],['Outra etapa','custom','custom','—','999',1]];
const developerRows=[['Parodinal','parodinal','concentrate','Sim','10',1],['Brewed Caffenol','brewed-caffenol','fresh','Não','20',1],['Rodinal / Adonal','rodinal','concentrate','Sim','30',1],['Kodak D-76','d76','stock','Sim','40',1],['Ilford ID-11','id11','stock','Sim','50',1],['Kodak XTOL','xtol','stock','Sim','60',0],['Kodak HC-110','hc110','concentrate','Sim','70',1],['Kodak T-MAX Developer','tmax','concentrate','Sim','80',1],['Ilford ILFOSOL 3','ilfosol3','concentrate','Sim','90',1],['Ilford ILFOTEC DD-X','ddx','concentrate','Sim','100',1],['Ilford MICROPHEN','microphen','stock','Sim','110',1],['Ilford PERCEPTOL','perceptol','stock','Sim','120',1],['Outro','other','custom','Sim','999',1]];
const catalogs=(kind)=>{const stages=kind==='stages';const rows=stages?stageRows:developerRows;return `<section class="admin-card"><header><div><p class="admin-kicker">Dados de domínio</p><h2>Etapas e reveladores</h2><p>Desativar uma entrada impede novos usos sem apagar snapshots ou registros históricos que já usam a chave.</p></div></header><nav class="admin-inline-actions"><button class="admin-button ${stages?'':'secondary'}">Etapas</button><button class="admin-button ${stages?'secondary':''}">Reveladores</button></nav></section><section class="admin-card"><header><div><p class="admin-kicker">${stages?'Etapas':'Reveladores'}</p><h2>${rows.length} definições</h2><p>${stages?'A chave é a identidade histórica da etapa.':'O modo de preparo determina como o sistema interpreta volume e diluição.'}</p></div></header><div class="admin-table-scroll"><table class="admin-data-table"><thead><tr>${stages?'<th>Etapa</th><th>Tipo</th><th>Químico padrão</th>':'<th>Revelador</th><th>Preparo</th><th>Armazenável</th>'}<th>Estado</th><th>Ordem</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><div class="admin-table-primary"><strong>${r[0]}</strong><span>${r[1]}</span></div></td><td>${r[2]}</td><td>${r[3]}</td><td><span class="admin-badge admin-badge--${r[5]?'good':'muted'}">${r[5]?'Ativo':'Desativado'}</span></td><td>${r[4]}</td><td><details ${i===2?'open':''}><summary class="admin-button secondary admin-table-action">Editar</summary><form class="admin-form-grid admin-process-step-form"><label class="admin-form-span-2">Nome<input value="${r[0]}"></label><label>${stages?'Tipo':'Modo'}<select><option>${r[2]}</option></select></label><label>Ordem<input value="${r[4]}"></label><label class="admin-check admin-form-span-2"><input type="checkbox" ${r[5]?'checked':''}><span>Disponível para novos usos</span></label><div class="admin-form-actions admin-form-span-2"><button class="admin-button">Salvar</button></div></form></details></td></tr>`).join('')}</tbody></table></div><details class="admin-secondary-setup"><summary class="admin-button secondary">Novo ${stages?'etapa':'revelador'}</summary></details></section>`;};
const params=new URLSearchParams(location.search),view=params.get('view')||'list';const screen=document.getElementById('screen');screen.innerHTML=view==='draft'?draft:view==='published'?published:view==='stages'?catalogs('stages'):view==='developers'?catalogs('developers'):list;if(view==='stages'||view==='developers'){document.getElementById('page-title').textContent='Catálogos do laboratório';document.querySelector('[data-nav-processes]').removeAttribute('aria-current');document.querySelector('[data-nav-catalogs]').setAttribute('aria-current','page');document.body.className='admin-page admin-section-lab-catalogs admin-workspace-laboratory';}
</script></body></html>
