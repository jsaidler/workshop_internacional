<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:"Courier New",monospace;--student-line-soft:#2d2b29;--ux-space-1:4px;--ux-space-2:8px;--ux-space-3:12px;--ux-space-4:16px;--ux-space-5:24px;--ux-space-6:32px;--ux-space-7:48px;--ux-space-8:64px}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css"><link rel="stylesheet" href="/assets/student-caderno.css"><link rel="stylesheet" href="/assets/student-quality-pass.css">
<title>Comparação e continuidade</title>
</head>
<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark">JSaidler Fotografia</a><nav class="student-desktop-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a></nav><span class="student-topbar-spacer"></span><button class="button button-secondary button-compact student-tools-trigger">Ferramentas</button><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a><button>Ferramentas</button></nav>
</div>
<script>
const resultSvg=(label,tone)=>`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675"><rect width="900" height="675" fill="#111"/><rect x="105" y="65" width="690" height="545" rx="18" fill="${tone}" opacity=".68"/><ellipse cx="455" cy="315" rx="145" ry="210" fill="#d8d3c8" opacity=".46"/><text x="450" y="620" fill="#eee" text-anchor="middle" font-family="Arial" font-size="26">${label}</text></svg>`)}`;
const shellHead=`<div class="student-appbar"><a class="student-back">← Caderno de Processos</a></div><p class="student-kicker">Comparação</p><h1 class="student-title">Comparar experimentações</h1><p class="student-lead">Veja o que foi registrado de modo diferente e leia essas diferenças junto com os resultados. A comparação descreve os registros; não atribui causa ao resultado.</p>`;
const selectScreen=`${shellHead}<section class="student-section student-research-picker"><div class="student-section-heading"><div><p class="student-kicker">Escolha</p><h2 class="student-subtitle">Escolha o segundo registro</h2></div><p>Use dois registros que façam sentido lado a lado para a pergunta que você quer investigar.</p></div><form class="student-research-picker-form"><article class="student-research-picked"><span class="student-card-label">Registro A</span><h3>EI 200 — FeCl₃</h3><p>01/10/2026 · Positivo direto em filme de raio-X · Turma Outubro 2026</p></article><label class="form-field">Registro B<select><option>EI 400 — FeCl₃ · 03/10/2026</option><option>EI 200 — peracética · 29/09/2026</option></select></label><div class="student-actions"><button class="button button-primary">Comparar registros</button></div></form></section>`;
const differences=[['Exposição','EI','200','400'],['Exposição','Tempo com reciprocidade','7 s','4 s'],['Processamento','Etapa 1 · Tempo','07:00','06:30']].map(row=>`<div class="student-research-difference-row"><div><small>${row[0]}</small><strong>${row[1]}</strong></div><span>${row[2]}</span><span>${row[3]}</span></div>`).join('');
const resultCard=(label,title,img,notes)=>`<article class="student-research-result-card"><span class="student-card-label">Registro ${label}</span><h3>${title}</h3><div class="student-research-result-media"><img src="${img}" alt="Resultado"></div><div class="student-research-result-notes"><small>Anotações</small><p>${notes}</p></div><a class="student-link">Abrir resultado</a></article>`;
const analysisScreen=`${shellHead}<section class="student-section student-research-differences"><div class="student-section-heading"><div><p class="student-kicker">O que mudou</p><h2 class="student-subtitle">Diferenças registradas</h2></div><p>Somente campos comparáveis que realmente mudaram aparecem aqui.</p></div><div class="student-research-comparison-head"><span></span><strong>A · EI 200 — FeCl₃</strong><strong>B · EI 400 — FeCl₃</strong></div><div class="student-research-difference-list">${differences}</div></section><section class="student-section student-research-results"><div class="student-section-heading"><div><p class="student-kicker">Resultado observado</p><h2 class="student-subtitle">Leia os resultados lado a lado</h2></div><p>As imagens e anotações são evidência do que foi obtido, não uma conclusão automática sobre a causa.</p></div><div class="student-research-result-grid">${resultCard('A','EI 200 — FeCl₃',resultSvg('Resultado A','#554f48'),'Sombras agrupadas; altas luzes ainda densas.')}${resultCard('B','EI 400 — FeCl₃',resultSvg('Resultado B','#736b60'),'Separação um pouco maior nas sombras; repetir antes de concluir.')}</div></section><section class="student-section student-research-evidence"><div class="student-section-heading"><div><p class="student-kicker">Dados registrados</p><h2 class="student-subtitle">Conferir exposição e processamento</h2></div><p>Use os dados completos para verificar a leitura acima.</p></div><details open><summary>Exposição</summary><div class="student-compare-grid student-compare-head"><div></div><h2>EI 200 — FeCl₃</h2><h2>EI 400 — FeCl₃</h2></div><div class="student-compare-grid is-different"><strong>EI</strong><span>200</span><span>400</span></div><div class="student-compare-grid"><strong>Abertura</strong><span>f/64</span><span>f/64</span></div><div class="student-compare-grid is-different"><strong>Tempo com reciprocidade</strong><span>7 s</span><span>4 s</span></div></details><details><summary>Processamento</summary><div class="student-compare-processes"><article><h3>EI 200 — FeCl₃</h3><ol class="student-process-summary"><li><strong>Parodinal</strong><span>10+550 · 26 °C · 07:00</span></li><li><strong>Cloreto férrico</strong><span>03:00</span></li></ol></article><article><h3>EI 400 — FeCl₃</h3><ol class="student-process-summary"><li><strong>Parodinal</strong><span>10+550 · 26 °C · 06:30</span></li><li><strong>Cloreto férrico</strong><span>03:00</span></li></ol></article></div></details></section><section class="student-section student-research-next"><div class="student-section-heading"><div><p class="student-kicker">Próxima tentativa</p><h2 class="student-subtitle">Continue a pesquisa</h2></div><p>Escolha qual registro será o ponto de partida e declare o que pretende mudar antes de criar a próxima tentativa.</p></div><form class="student-research-next-form"><fieldset class="choice-field"><legend>Usar como base</legend><div class="student-research-basis-options"><label class="choice-option"><input type="radio" name="base"><span>A · EI 200 — FeCl₃</span></label><label class="choice-option"><input type="radio" name="base" checked><span>B · EI 400 — FeCl₃</span></label></div></fieldset><label class="form-field">O que você pretende mudar nesta próxima tentativa?<textarea rows="4">Manter EI 400 e voltar a primeira revelação para 7 minutos.</textarea></label><p class="student-field-help">O novo registro começa com os dados de exposição da base. Processamento e resultado não são copiados como fatos já realizados.</p><div class="student-actions"><button class="button button-primary">Criar próxima variação</button></div></form></section>`;
const derivedScreen=`<div class="student-page-heading student-notebook-heading"><div><p class="student-kicker">Caderno</p><h1 class="student-title">Caderno de Processos</h1><p class="student-notebook-intro">Cada registro acompanha uma fotografia da exposição ao resultado.</p></div><button class="button button-primary">Novo registro</button></div><section class="student-section student-notebook-records"><div class="student-section-heading student-notebook-section-heading"><div><p class="student-kicker">Seus registros</p><h2 class="student-subtitle">4 registros</h2></div><p>A continuidade fica vinculada ao registro usado como origem.</p></div><div class="student-process-list student-notebook-list"><article class="student-process-card student-notebook-card"><a class="student-process-card-main"><div class="student-notebook-card-copy"><span class="student-card-label">Positivo direto · Turma Outubro 2026</span><h3>Variação de EI 400 — FeCl₃</h3><p>Exposição ainda não registrada</p><p class="student-research-card-lineage">Continuação de <strong>EI 400 — FeCl₃</strong> · Manter EI 400 e voltar a primeira revelação para 7 minutos.</p><div class="student-record-progress"><span class="is-current"><i>01</i>Exposição</span><span class="is-pending"><i>02</i>Processamento</span><span class="is-pending"><i>03</i>Resultado</span></div></div><div class="student-process-card-state"><strong>Registrar exposição →</strong><span>Sem data<br>Atualizado hoje</span></div></a><div class="student-process-card-footer"><span class="student-status">Privado</span><details class="student-record-menu"><summary>Mais ações</summary><div class="student-record-menu-panel"><a class="button button-secondary button-compact">Comparar com origem</a><button class="button button-secondary button-compact">Duplicar registro</button></div></details></div></article></div></section>`;
const screen=new URLSearchParams(location.search).get('screen')||'analysis';document.getElementById('screen').innerHTML=screen==='select'?selectScreen:screen==='derived'?derivedScreen:analysisScreen;
</script>
</body></html>
