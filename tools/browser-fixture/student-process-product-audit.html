<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:"Courier New",monospace;--ux-space-1:4px;--ux-space-2:8px;--ux-space-3:12px;--ux-space-4:16px;--ux-space-5:24px;--ux-space-6:32px;--ux-space-7:48px;--ux-space-8:64px}html,body{min-height:100%}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-processes.css">
<title>Student process product audit</title>
</head>
<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark" href="#">JSaidler Fotografia</a><nav class="student-desktop-nav"><a>Início</a><a>Curso</a><a>Caderno</a></nav><span class="student-topbar-spacer"></span><button class="button button-secondary button-compact student-tools-trigger">Ferramentas</button><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav"><a>Início</a><a>Curso</a><a>Caderno</a><button>Ferramentas</button></nav>
</div>
<script>
const standards=[
 {ei:'EI 200',developer:'Parodinal',route:'FeCl₃ + amônia',name:'Positivo direto — Parodinal EI 200 — FeCl₃ + amônia',summary:'Parodinal 10 ml + água até 550 ml, 26 °C, 7 min e agitação leve.',steps:9,time:'19:30 + etapas livres'},
 {ei:'EI 400',developer:'Parodinal',route:'FeCl₃ + amônia',name:'Positivo direto — Parodinal EI 400 — FeCl₃ + amônia',summary:'Parodinal 20 ml + água até 550 ml, 26 °C, 7 min e agitação leve.',steps:9,time:'19:30 + etapas livres'},
 {ei:'EI 200',developer:'Parodinal',route:'Peracética',name:'Positivo direto — Parodinal EI 200 — peracética',summary:'Parodinal 10 ml + água até 550 ml, 26 °C, 7 min e agitação leve.',steps:7,time:'18:30 + etapas livres'},
 {ei:'EI 400',developer:'Parodinal',route:'Peracética',name:'Positivo direto — Parodinal EI 400 — peracética',summary:'Parodinal 20 ml + água até 550 ml, 26 °C, 7 min e agitação leve.',steps:7,time:'18:30 + etapas livres'},
 {ei:'EI 400',developer:'Brewed Caffenol',route:'FeCl₃ + amônia',name:'Positivo direto — Brewed Caffenol EI 400 — FeCl₃ + amônia',summary:'Brewed Caffenol fresco, 35,7 °C, 5 min. O mesmo banho é reutilizado na segunda revelação.',steps:9,time:'15:30 + etapas livres'},
 {ei:'EI 400',developer:'Brewed Caffenol',route:'Peracética',name:'Positivo direto — Brewed Caffenol EI 400 — peracética',summary:'Brewed Caffenol fresco, 35,7 °C, 5 min. O mesmo banho é reutilizado na segunda revelação.',steps:7,time:'14:30 + etapas livres'}
];
const ferricSteps=[
 ['01','Primeira revelação','Parodinal · 26 °C · Tempo 07:00'],
 ['02','Lavagem','Tempo 01:00'],
 ['03','Branqueamento — cloreto férrico','Tempo 01:30'],
 ['04','Lavagem após branqueamento','Tempo 01:00'],
 ['05','Limpeza — amônia','Sem tempo definido'],
 ['06','Lavagem após amônia','Tempo 01:00'],
 ['07','Segunda revelação','Parodinal · 26 °C · Tempo 07:00'],
 ['08','Lavagem final','Tempo 01:00'],
 ['09','Secagem','Sem tempo definido']
];
const standardCards=standards.map(s=>`<article class="student-process-standard-card" data-developer="${s.developer}"><div class="student-process-standard-meta"><span>${s.ei}</span><span>${s.developer}</span><span>${s.route}</span></div><h3>${s.name}</h3><p>${s.summary}</p><div class="student-process-standard-footer"><span>${s.steps} etapas · ${s.time}</span><button class="button button-primary button-compact">Adicionar aos meus</button></div></article>`).join('');
const stepCards=ferricSteps.map(([n,name,meta],i)=>`<li class="student-process-step-card${n==='08'?' is-editing':''}" data-stage="${n}"><span class="student-process-step-index">${n}</span><div class="student-process-step-body"><h3>${name}</h3><p>${meta}</p>${n==='07'?'<div class="student-process-reuse-note"><strong>Mesmo banho da 1ª revelação</strong><span>Reutilize a solução já preparada; não prepare outro revelador.</span></div>':''}</div><div class="student-process-step-actions"><button class="button button-secondary button-compact">Editar</button>${i>0?'<button class="student-link">Subir</button>':''}${i<ferricSteps.length-1?'<button class="student-link">Descer</button>':''}<button class="student-danger-action">Remover</button></div>${n==='08'?'<div class="student-process-step-editor"><div class="student-process-inline-help"><strong>Editar etapa</strong><span>Altere somente o que muda neste ponto do roteiro.</span></div><form class="student-form-grid"><label class="form-field student-span-2">Etapa<select><option>Lavagem final</option></select></label><label class="form-field">Tempo<input value="1:00"></label><label class="form-field">Aviso de agitação<input></label><label class="form-field">Temperatura<input></label><label class="form-field">Agitação<input></label><div class="student-actions student-span-2"><button class="button button-primary">Salvar etapa</button><button class="button button-secondary">Cancelar</button></div></form></div>':''}</li>`).join('');
const runnerTimeline=ferricSteps.map(([n,name,meta],i)=>`<li class="${i<6?'is-done':i===6?'is-active':''}"><span>${n}</span><div><strong>${name}</strong><small>${meta.replace('Tempo ','').replace('Parodinal · 26 °C · ','')}</small></div></li>`).join('');

const library=`
<header class="student-page-heading student-process-library-heading"><div><p class="student-kicker">Laboratório</p><h1 class="student-title">Processamentos</h1><p class="student-process-context">Salve e reutilize as sequências de processamento que você usa no laboratório.</p></div></header>
<section class="student-process-section"><div class="student-process-section-heading"><div><p class="student-kicker">Sua biblioteca</p><h2 class="student-subtitle">Meus processamentos</h2></div><p>Use um roteiro salvo como está ou abra para ajustar etapas, tempos e observações.</p></div>
<div class="student-process-library">
<article class="student-process-template-card"><a class="student-process-template-main"><span class="student-process-step-number">09</span><div><h3>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h3><p>Parodinal 10 ml + água até 550 ml, 26 °C, 7 min.</p><div class="student-process-summary"><span>9 etapas</span><span>19:30 + etapas livres</span></div></div></a><div class="student-process-template-actions"><a class="button button-primary button-compact">Abrir no laboratório</a><a class="button button-secondary button-compact">Editar</a><button class="button button-secondary button-compact">Duplicar</button><button class="student-danger-action">Excluir</button></div></article>
<article class="student-process-template-card"><a class="student-process-template-main"><span class="student-process-step-number">09</span><div><h3>Brewed Caffenol EI 400 — FeCl₃ + amônia</h3><p>Brewed Caffenol fresco, 35,7 °C, 5 min.</p><div class="student-process-summary"><span>9 etapas</span><span>15:30 + etapas livres</span></div></div></a><div class="student-process-template-actions"><a class="button button-primary button-compact">Abrir no laboratório</a><a class="button button-secondary button-compact">Editar</a><button class="button button-secondary button-compact">Duplicar</button><button class="student-danger-action">Excluir</button></div></article>
</div></section>
<section class="student-process-section student-process-standards"><div class="student-process-section-heading"><div><p class="student-kicker">Padrões do workshop</p><h2 class="student-subtitle">Roteiros conhecidos</h2></div><p>Escolha revelador, EI e rota de branqueamento. A segunda revelação reutiliza o mesmo banho da primeira.</p></div><div class="student-process-standard-grid">${standardCards}</div></section>
<details class="student-process-create"><summary><span><strong>Criar um processamento do zero</strong><small>Use esta opção quando o roteiro não parte de um padrão do workshop.</small></span><span>＋</span></summary></details>`;

const editor=`
<header class="student-page-heading student-process-library-heading"><div><p class="student-kicker">Laboratório</p><h1 class="student-title">Processamentos</h1><p class="student-process-context">Edite este roteiro sem alterar cópias já registradas no Caderno.</p></div><a class="button button-secondary">← Meus processamentos</a></header>
<section class="student-process-editor"><div class="student-process-editor-overview"><div><p class="student-kicker">Roteiro salvo</p><h2>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h2><p>Parodinal 10 ml + água até 550 ml. Mesmo banho reutilizado na segunda revelação.</p></div><div class="student-process-editor-stats"><span><strong>9</strong>etapas</span><span><strong>19:30 + livres</strong>tempo programado</span></div></div><div class="student-process-editor-actions"><a class="button button-primary">Abrir no laboratório</a><button class="button button-secondary">Duplicar processamento</button></div>
<details class="student-process-meta-panel"><summary>Editar nome e descrição</summary></details>
<div class="student-process-editor-heading"><div><p class="student-kicker">Sequência</p><h2 class="student-subtitle">Etapas do processamento</h2><p>Revise a ordem e os parâmetros antes de usar o roteiro.</p></div></div><ol class="student-process-step-list">${stepCards}</ol><details class="student-process-add"><summary><span><strong>Adicionar etapa</strong><small>Inclua um novo banho ou operação no fim da sequência.</small></span><span>＋</span></summary></details><section class="student-danger-zone student-process-danger-zone"><h2>Excluir processamento</h2><p>Exclui este roteiro da sua biblioteca. Registros do Caderno que já receberam uma cópia do plano não serão alterados.</p><button class="student-danger-action">Excluir processamento</button></section></section>`;

const params=new URLSearchParams(location.search);const screen=params.get('screen')||'library';document.getElementById('screen').innerHTML=screen==='editor'?editor:library;
</script>
</body></html>
