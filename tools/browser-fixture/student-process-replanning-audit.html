<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:"Courier New",monospace;--ux-space-1:4px;--ux-space-2:8px;--ux-space-3:12px;--ux-space-4:16px;--ux-space-5:24px;--ux-space-6:32px;--ux-space-7:48px;--ux-space-8:64px;--student-line-soft:#383633}html,body{min-height:100%}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css"><link rel="stylesheet" href="/assets/student-caderno.css"><link rel="stylesheet" href="/assets/student-process-recording.css"><link rel="stylesheet" href="/assets/student-processes.css"><link rel="stylesheet" href="/assets/student-process-replanning.css"><link rel="stylesheet" href="/assets/student-quality-pass.css">
<title>Process replanning audit</title>
</head>
<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark">JSaidler Fotografia</a><nav class="student-desktop-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a></nav><span class="student-topbar-spacer"></span><button class="button button-secondary button-compact student-tools-trigger">Ferramentas</button><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a><button>Ferramentas</button></nav>
</div>
<script>
const standards=[
 {key:'f200',ei:'EI 200',developer:'Parodinal',route:'FeCl₃ + amônia',name:'Positivo direto — Parodinal EI 200 — FeCl₃ + amônia',steps:9,time:'19:30 + etapas livres'},
 {key:'f400',ei:'EI 400',developer:'Parodinal',route:'FeCl₃ + amônia',name:'Positivo direto — Parodinal EI 400 — FeCl₃ + amônia',steps:9,time:'19:30 + etapas livres'},
 {key:'p200',ei:'EI 200',developer:'Parodinal',route:'Peracética',name:'Positivo direto — Parodinal EI 200 — peracética',steps:7,time:'18:30 + etapas livres'},
 {key:'p400',ei:'EI 400',developer:'Parodinal',route:'Peracética',name:'Positivo direto — Parodinal EI 400 — peracética',steps:7,time:'18:30 + etapas livres'},
 {key:'cf',ei:'EI 400',developer:'Caffenol',route:'FeCl₃ + amônia',name:'Positivo direto — Brewed Caffenol EI 400 — FeCl₃ + amônia',steps:9,time:'15:30 + etapas livres'},
 {key:'cp',ei:'EI 400',developer:'Caffenol',route:'Peracética',name:'Positivo direto — Brewed Caffenol EI 400 — peracética',steps:7,time:'14:30 + etapas livres'}
];
const standardCards=standards.map((s,i)=>`<article class="student-process-standard-card${i===0?' is-current':''}"><div class="student-process-standard-meta"><span>${s.ei}</span><span>${s.developer}</span><span>${s.route}</span>${i===0?'<span>Atual</span>':''}</div><h3>${s.name}</h3><div class="student-process-standard-footer"><span>${s.steps} etapas · ${s.time}</span><button class="button ${i===0?'button-secondary':'button-primary'} button-compact">${i===0?'Reaplicar daqui em diante':'Usar nas próximas etapas'}</button></div></article>`).join('');
const partial=`
<header class="student-record-header"><div class="student-record-context"><a class="student-back">← Caderno</a><span class="student-status">Rascunho</span></div><p class="student-kicker">Registro pessoal</p><h1 class="student-title student-title-record">Teste EI 200 — mudança de branqueamento</h1></header>
<nav class="student-step-nav student-record-step-nav"><a><span>01</span><div><strong>Exposição</strong><small>Como expus</small></div></a><a aria-current="step"><span>02</span><div><strong>Processamento</strong><small>Como revelei</small></div></a><a aria-disabled="true"><span>03</span><div><strong>Resultado</strong><small>O que obtive</small></div></a></nav>
<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">02 · Processamento</p><h2 class="student-subtitle">Como revelei</h2></div></div><section class="student-caderno-plan-card"><div class="student-caderno-plan-head"><div><p class="student-kicker">Em andamento</p><h3>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h3></div><span class="student-plan-progress">3 / 9 etapas</span></div><div class="student-caderno-plan-next"><span>Próxima etapa</span><strong>Lavagem após branqueamento</strong><small>01:00</small></div><div class="student-actions student-plan-resume-actions"><button class="button button-primary">Continuar laboratório</button><button class="button button-secondary">Completar registro</button></div><div class="student-plan-secondary-actions"><a class="student-link" data-route-change-link>Alterar próximas etapas</a></div></section></section>`;
const choice=(activeOnly=false)=>`
<div class="student-appbar"><a class="student-back">← Processamento</a></div><header class="student-page-heading student-replanning-heading"><div><p class="student-kicker">Caderno</p><h1 class="student-title">Alterar próximas etapas</h1><p class="student-process-context">${activeOnly?'Nenhuma etapa foi consolidada pelo Caderno. Trocar o roteiro agora muda apenas o snapshot desta fotografia.':'<strong>3 etapas realizadas</strong> permanecem no histórico. A escolha abaixo muda somente o que ainda não foi consolidado.'}</p></div></header><section class="student-replanning-current"><span>Roteiro atual</span><strong>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</strong></section>
<section class="student-process-section"><div class="student-process-section-heading"><div><p class="student-kicker">Sua biblioteca</p><h2 class="student-subtitle">Meus processamentos</h2></div></div><div class="student-process-library"><article class="student-process-template-card"><div class="student-process-template-main"><span class="student-process-step-number">07</span><div><div class="student-replanning-title-row"><h3>Positivo direto — EI 200 — peracética ajustada</h3></div><div class="student-process-summary"><span>7 etapas</span><span>18:30 + etapas livres</span></div></div></div><div class="student-process-template-actions"><button class="button button-primary button-compact">Usar nas próximas etapas</button></div></article></div></section>
<section class="student-process-section student-process-standards"><div class="student-process-section-heading"><div><p class="student-kicker">Padrões do workshop</p><h2 class="student-subtitle">Roteiros conhecidos</h2></div></div><div class="student-process-standard-grid">${standardCards}</div></section>`;
const recorded=`
<div class="student-appbar"><a class="student-back">← Processamento</a></div><header class="student-page-heading student-recording-heading"><div><p class="student-kicker">Caderno</p><h1 class="student-title">Registrar processamento</h1><p class="student-lead">Registre a sequência que você realmente realizou.</p></div></header><section class="student-workflow-panel student-recording-plan"><p class="student-kicker">Registro parcial</p><h2 class="student-subtitle">Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h2><p class="student-recording-plan-status">3 de 9 etapas registradas.</p><button class="button button-primary">Registrar etapas restantes</button><div class="student-actions"><a class="student-link" data-route-change-link>Trocar próximas etapas</a></div></section><section class="student-section"><div class="student-section-heading"><div><p class="student-kicker">Sequência registrada</p><h2 class="student-subtitle">3 etapas</h2></div></div><div class="student-process-history"><article><div><span>01</span><div><strong>Primeira revelação</strong><p>Parodinal · 7:00 · 26 °C</p></div></div></article><article><div><span>02</span><div><strong>Lavagem com água</strong><p>1:00</p></div></div></article><article><div><span>03</span><div><strong>Cloreto férrico</strong><p>1:30</p></div></div></article></div></section>`;
const params=new URLSearchParams(location.search),view=params.get('view')||'partial';document.getElementById('screen').innerHTML=view==='choice'?choice(false):view==='active'?choice(true):view==='recorded'?recorded:partial;
</script>
</body></html>
