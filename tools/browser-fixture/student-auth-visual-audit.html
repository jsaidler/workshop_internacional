<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:"Courier New",monospace;--ux-space-1:4px;--ux-space-2:8px;--ux-space-3:12px;--ux-space-4:16px;--ux-space-5:24px;--ux-space-6:32px;--ux-space-7:48px;--ux-space-8:64px}html,body{min-height:100%}body{overflow-y:auto}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css"><link rel="stylesheet" href="/assets/student-rendered-fixes.css"><link rel="stylesheet" href="/assets/student-auth.css">
<title>Student auth visual audit</title>
</head>
<body class="student-page"><div class="student-shell"><header class="student-topbar"><a class="brand student-wordmark" href="#">JSaidler Fotografia</a><span class="student-topbar-spacer"></span></header><main class="student-main" id="screen"></main></div>
<script>
const screens={
login:`<div class="student-auth-page"><header class="student-auth-intro"><p class="student-kicker">Área do aluno</p><h1 class="student-title">Acesso</h1><p class="student-lead student-lead-compact">Entre com sua conta. Se este é o primeiro acesso, ative-a com os mesmos dados usados na inscrição.</p></header><div class="student-auth-grid"><section class="student-auth-section student-auth-primary"><p class="student-kicker">Conta ativada</p><h2 class="student-subtitle">Entrar</h2><form class="student-auth-form"><label class="form-field">E-mail<input type="email"></label><label class="form-field">Senha<input type="password"></label><div class="student-auth-actions"><button class="button button-primary">Entrar</button></div></form></section><section class="student-auth-section student-auth-secondary"><p class="student-kicker">Primeiro acesso</p><h2 class="student-subtitle">Ativar conta</h2><p class="student-auth-copy">Depois que a matrícula for confirmada, use o mesmo e-mail da inscrição e o CPF somente com números. O CPF é usado apenas neste reconhecimento inicial; em seguida você cria sua própria senha.</p><form class="student-auth-form"><label class="form-field">E-mail da inscrição<input type="email"></label><label class="form-field">CPF<input inputmode="numeric"></label><div class="student-auth-actions"><button class="button button-secondary">Ativar conta</button></div></form></section></div></div>`,
password:`<section class="student-login-card"><p class="student-kicker">Primeiro acesso</p><h1 class="student-title student-auth-title">Crie sua senha</h1><p class="student-lead student-auth-copy">O CPF foi usado somente para confirmar a matrícula. A partir de agora o acesso será feito com seu e-mail e esta senha.</p><form><label class="form-field">Nova senha<input type="password"><span class="form-field-help">Mínimo de 12 caracteres.</span></label><label class="form-field">Confirmar senha<input type="password"></label><label class="check-field"><input type="checkbox"><span>Li o Aviso de Privacidade e estou ciente de como os dados da conta são utilizados.</span></label><button class="button button-primary">Ativar conta</button></form></section>`
};
const params=new URLSearchParams(location.search);const screen=params.get('screen')||'login';document.getElementById('screen').innerHTML=screens[screen]||screens.login;
</script>
</body></html>
