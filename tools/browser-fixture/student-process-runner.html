<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-processes.css"><title>Modo laboratório</title></head><body class="student-page"><main class="student-main"><header class="student-process-runner-head"><div><p class="student-kicker">Modo laboratório</p><h1 class="student-title">Positivo direto — teste</h1></div></header><section class="student-process-runner" data-process-runner data-duration-seconds="2" data-agitation-seconds="1" data-storage-key="fixture-process-step-1" data-final-stage="0"><div class="student-process-runner-progress"><span>1 / 2</span><div><i style="--student-process-progress:50%"></i></div></div><div class="student-process-runner-current"><p class="student-kicker">Etapa atual</p><h2>Primeira revelação</h2><p class="student-process-runner-details">Parodinal · 26 °C</p></div><output class="student-process-runner-clock" data-runner-clock>00:02</output><p class="student-process-runner-cue" data-runner-cue aria-live="polite"></p><div class="student-process-runner-status"><span data-runner-wake-status>Tela ativa ao iniciar</span><span>Aviso a cada 00:01</span></div><div class="student-actions student-process-runner-controls"><button class="button button-primary" type="button" data-runner-start>Iniciar</button><button class="button button-secondary" type="button" data-runner-pause disabled>Pausar</button><button class="button button-secondary" type="button" data-runner-reset>Reiniciar</button></div><div class="student-process-runner-next"><span>Próxima</span><strong>Lavagem</strong><small>01:00</small></div><div class="student-process-runner-advance"><a class="button button-primary is-disabled" data-runner-complete href="#next" aria-disabled="true" tabindex="-1">Próxima
