<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css"><link rel="stylesheet" href="/assets/student-rendered-fixes.css"><link rel="stylesheet" href="/assets/student-caderno.css">

<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark">JSaidler Fotografia</a><nav class="student-desktop-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a></nav><span class="student-topbar-spacer"></span><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a><button>Ferramentas</button></nav>
</div>
<script>
const recordHeader=`<header class="student-record-header"><div class="student-record-context"><a class="student-back">← Caderno</a><span class="student-status">Rascunho</span></div><p class="student-kicker">Positivo Direto · Turma setembro</p><h1 class="student-title student-title-record">Teste EI 200 — FeCl₃</h1><p class="student-record-purpose">Este registro conecta as condições da exposição, o processamento realizado e o resultado obtido.</p></header>`;
const stepNav=current=>`<nav class="student-step-nav student-record-step-nav"><a ${current==='exposure'?'aria-current="step"':''}><span>01</span><div><strong>Exposição</strong><small>Como expus</small></div></a><a ${current==='process'?'aria-current="step"':''}><span>02</span><div><strong>Processamento</strong><small>Como revelei</small></div></a><a ${current==='result'?'aria-current="step"':''}><span>03</span><div><strong>Resultado</strong><small>O que obtive</small></div></a></nav>`;
const screens={
notebook:`<div class="student-page-heading student-notebook-heading"><div><p class="student-kicker">Caderno</p><h1 class="student-title">Caderno de Processos</h1><p class="student-notebook-intro">Cada registro acompanha uma fotografia da exposição ao resultado. Use o Caderno para relacionar <strong>como você expôs</strong>, <strong>como processou</strong> e <strong>o que obteve</strong>.</p></div><button class="button button-primary">Novo registro</button></div><section class="student-section student-notebook-records"><div class="student-section-heading student-notebook-section-heading"><div><p class="student-kicker">Seus registros</p><h2 class="student-subtitle">3 registros</h2></div><p>Abra um registro para continuar exatamente da etapa em que parou.</p></div><div class="student-process-list student-notebook-list"><article class="student-process-card student-notebook-card"><a class="student-process-card-main"><div class="student-notebook-card-copy"><span class="student-card-label">Positivo Direto · Turma setembro</span><h3>Teste EI 200 — FeCl₃</h3><p>Última etapa: Lavagem após branqueamento</p><div class="student-record-progress"><span class="is-done"><i>01</i>Exposição</span><span class="is-current"><i>02</i>Processamento</span><span class="is-pending"><i>03</i>Resultado</span></div></div><div class="student-process-card-state"><strong>Continuar processamento →</strong><span>01/10/2026<br>Atualizado hoje</span></div></a><div class="student-process-card-footer"><span class="student-status">Privado</span><details class="student-record-menu"><summary>Mais ações</summary></details></div></article><article class="student-process-card student-notebook-card"><a class="student-process-card-main"><div class="student-notebook-card-copy"><span class="student-card-label">Pessoal</span><h3>EI 400 — peracética</h3><p>Processamento concluído</p><div class="student-record-progress"><span class="is-done"><i>01</i>Exposição</span><span class="is-done"><i>02</i>Processamento</span><span class="is-current"><i>03</i>Resultado</span></div></div><div class="student-process-card-state"><strong>Registrar resultado →</strong><span>30/09/2026<br>Atualizado ontem</span></div></a><div class="student-process-card-footer"><span class="student-status">Pessoal</span><details class="student-record-menu"><summary>Mais ações</summary></details></div></article></div></section>`,
exposure:`${recordHeader}${stepNav('exposure')}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">01 · Exposição</p><h2 class="student-subtitle">Como expus</h2></div><p>Registre as condições que levaram à exposição. Depois, estes dados poderão ser confrontados com o processamento e com o resultado.</p></div><form class="student-mobile-form student-record-form"><div class="student-capture-block"><div><span class="student-capture-number">A</span><div><h3>Referência da cena</h3><p>Opcional. Serve para lembrar a situação fotografada; não é a imagem do resultado.</p></div></div><label class="button button-secondary student-capture-button">Fotografar ou anexar</label></div><div class="student-form-group"><h3>Dados da exposição</h3><p class="student-form-group-intro">Preencha o que foi realmente usado na fotografia. O objetivo é conseguir repetir ou comparar a condição depois.</p><div class="student-form-grid"><label class="form-field student-span-2">Título<input value="Teste EI 200 — FeCl₃"></label><label class="form-field">Data<input type="date" value="2026-10-01"></label><label class="form-field">Filme<input value="Fuji Super H-RU"></label><label class="form-field">EI<input value="200"></label><label class="form-field">Abertura<input value="f/64"></label><label class="form-field">Tempo sem reciprocidade<input value="4 s"></label><label class="form-field">Tempo com reciprocidade<input value="7 s" readonly></label></div></div><div class="student-sticky-action"><button class="button button-primary">Salvar exposição e continuar →</button></div></form></section>`,
'process-choice':`${recordHeader}${stepNav('process')}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">02 · Processamento</p><h2 class="student-subtitle">Como revelei</h2></div><p>Registre a sequência realmente usada no laboratório. Um roteiro salvo ajuda a executar as etapas; o modo manual fica disponível para experimentações fora de um roteiro pronto.</p></div><section class="student-process-path-choice"><div class="student-process-choice-intro"><p class="student-kicker">Antes de começar</p><h3>Como você quer registrar o processamento?</h3><p>Para repetir um processo do workshop ou um roteiro que você já montou, use um processamento salvo. O registro manual é uma alternativa para trabalhar sem roteiro prévio.</p></div><div class="student-process-path-options"><article class="is-recommended"><span>Recomendado</span><h4>Usar um processamento salvo</h4><p>Escolha um roteiro, confira as etapas e execute no modo laboratório com temporização e orientação etapa a etapa.</p><a class="button button-primary">Escolher processamento</a></article><article><span>Alternativa</span><h4>Registrar etapas manualmente</h4><p>Use quando você estiver experimentando uma sequência que ainda não quer transformar em roteiro salvo.</p><a class="student-link">Abrir registro manual ↓</a></article></div></section></section>`,
'process-plan':`${recordHeader}${stepNav('process')}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">02 · Processamento</p><h2 class="student-subtitle">Como revelei</h2></div><p>Registre a sequência realmente usada no laboratório. Um roteiro salvo ajuda a executar as etapas; o modo manual fica disponível para experimentações fora de um roteiro pronto.</p></div><section class="student-caderno-plan-card"><div class="student-caderno-plan-head"><div><p class="student-kicker">Roteiro aplicado</p><h3>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h3></div><span class="student-plan-progress">5 / 9 etapas</span></div><div class="student-caderno-plan-next"><span>Próxima etapa</span><strong>Lavagem após branqueamento</strong><small>01:00</small></div><p>O modo laboratório conduz uma etapa de cada vez, mantém o roteiro visível e registra no Caderno apenas o que você concluir.</p><div class="student-actions"><a class="button button-primary">Continuar no modo laboratório</a></div></section><details class="student-process-history"><summary>Etapas já registradas · 5 etapas</summary></details></section>`,
result:`${recordHeader}${stepNav('result')}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">03 · Resultado</p><h2 class="student-subtitle">O que obtive</h2></div><p>Reveja a exposição e o processamento antes de registrar o resultado. O objetivo é deixar claro o que você repetiria e o que ajustaria no próximo teste.</p></div><section class="student-result-context"><div class="student-result-context-head"><p class="student-kicker">Este experimento</p><h3>Exposição e processamento, lado a lado</h3></div><div class="student-result-context-grid"><article><span>01 · Como expus</span><dl><div><dt>Filme</dt><dd>Fuji Super H-RU</dd></div><div><dt>EI</dt><dd>200</dd></div><div><dt>Abertura</dt><dd>f/64</dd></div><div><dt>Tempo</dt><dd>7 s</dd></div></dl><a>Rever exposição</a></article><article><span>02 · Como revelei</span><dl><div><dt>Etapas registradas</dt><dd>9</dd></div><div><dt>1ª revelação</dt><dd>Parodinal</dd></div><div><dt>Branqueamento</dt><dd>Cloreto férrico</dd></div><div><dt>Estado</dt><dd>Concluído</dd></div></dl><a>Rever processamento</a></article></div></section><div class="student-result-flow"><form class="student-mobile-form student-result-form"><div class="student-capture-block"><div><span class="student-capture-number">B</span><div><h3>Imagem do resultado</h3><p>Fotografia da chapa processada para documentar o que foi obtido.</p></div></div><label class="button button-secondary student-capture-button">Fotografar ou anexar</label></div><label class="form-field">Anotações sobre o resultado<textarea rows="5"></textarea></label><p class="student-field-help">Anote o que observou no positivo e, quando fizer sentido, o que você manteria ou mudaria numa próxima tentativa.</p><div class="student-result-actions"><button class="button button-primary">Salvar resultado</button></div></form></div></section>`
};
const params=new URLSearchParams(location.search);document.getElementById('screen').innerHTML=screens[params.get('screen')||'notebook'];
</script>
