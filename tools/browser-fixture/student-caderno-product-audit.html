<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:"Courier New",monospace;--student-line-soft:#2d2b29;--ux-space-1:4px;--ux-space-2:8px;--ux-space-3:12px;--ux-space-4:16px;--ux-space-5:24px;--ux-space-6:32px;--ux-space-7:48px;--ux-space-8:64px}html,body{min-height:100%}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css"><link rel="stylesheet" href="/assets/student-rendered-fixes.css"><link rel="stylesheet" href="/assets/student-caderno.css"><link rel="stylesheet" href="/assets/student-quality-pass.css">
<title>Caderno product audit</title>
</head>
<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark">JSaidler Fotografia</a><nav class="student-desktop-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a></nav><span class="student-topbar-spacer"></span><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav"><a>Início</a><a>Curso</a><a aria-current="page">Caderno</a><button>Ferramentas</button></nav>
</div>
<script>
const recordHeader=`<header class="student-record-header"><div class="student-record-context"><a class="student-back">← Caderno</a><span class="student-status">Rascunho</span></div><p class="student-kicker">Positivo Direto · Turma setembro</p><h1 class="student-title student-title-record">Teste EI 200 — FeCl₃</h1><p class="student-record-purpose">Exposição, processamento e resultado no mesmo registro.</p></header>`;
const stepNav=current=>`<nav class="student-step-nav student-record-step-nav"><a ${current==='exposure'?'aria-current="step"':''}><span>01</span><div><strong>Exposição</strong><small>Como expus</small></div></a><a ${current==='process'?'aria-current="step"':''}><span>02</span><div><strong>Processamento</strong><small>Como revelei</small></div></a><a ${current==='result'?'aria-current="step"':''}><span>03</span><div><strong>Resultado</strong><small>O que obtive</small></div></a></nav>`;
const workflow=`<div class="student-workflow-heading"><div><p class="student-kicker">02 · Processamento</p><h2 class="student-subtitle">Como revelei</h2></div><p>Registre o processamento como ele aconteceu.</p></div>`;
const progress=(a,b,c)=>`<div class="student-record-progress"><span class="${a}"><i>01</i>Exposição</span><span class="${b}"><i>02</i>Processamento</span><span class="${c}"><i>03</i>Resultado</span></div>`;
const card=({label,title,desc,a,b,c,action,date,status})=>`<article class="student-process-card student-notebook-card"><a class="student-process-card-main"><div class="student-notebook-card-copy"><span class="student-card-label">${label}</span><h3>${title}</h3><p>${desc}</p>${progress(a,b,c)}</div><div class="student-process-card-state"><strong>${action} →</strong><span>${date}</span></div></a><div class="student-process-card-footer"><span class="student-status">${status}</span><details class="student-record-menu"><summary>Mais ações</summary></details></div></article>`;
const notebookCards=[
 card({label:'Positivo Direto · Turma setembro',title:'Teste EI 200 — FeCl₃',desc:'Roteiro associado: Positivo direto — Parodinal EI 200 — FeCl₃ + amônia',a:'is-done',b:'is-current',c:'is-pending',action:'Definir como registrar',date:'01/10/2026<br>Atualizado hoje',status:'Privado'}),
 card({label:'Pessoal',title:'EI 400 — peracética',desc:'Processamento concluído',a:'is-done',b:'is-done',c:'is-current',action:'Registrar resultado',date:'30/09/2026<br>Atualizado ontem',status:'Pessoal'}),
 card({label:'Positivo Direto · Estudos',title:'EI 400 — Brewed Caffenol',desc:'Exposição registrada. Processamento ainda não definido.',a:'is-done',b:'is-current',c:'is-pending',action:'Registrar processamento',date:'27/09/2026<br>Atualizado há 5 dias',status:'Privado'})
].join('');
const screens={
notebook:`<div class="student-page-heading student-notebook-heading"><div><p class="student-kicker">Caderno</p><h1 class="student-title">Caderno de Processos</h1><p class="student-notebook-intro">Cada registro acompanha uma fotografia da exposição ao resultado. Use o Caderno para relacionar <strong>como você expôs</strong>, <strong>como processou</strong> e <strong>o que obteve</strong>.</p></div><button class="button button-primary">Novo registro</button></div><section class="student-section student-notebook-records"><div class="student-section-heading student-notebook-section-heading"><div><p class="student-kicker">Seus registros</p><h2 class="student-subtitle">3 registros</h2></div></div><div class="student-process-list student-notebook-list">${notebookCards}</div></section>`,
exposure:`${recordHeader}${stepNav('exposure')}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">01 · Exposição</p><h2 class="student-subtitle">Como expus</h2></div><p>Registre as condições usadas na fotografia.</p></div><form class="student-mobile-form student-record-form"><div class="student-capture-block"><div><span class="student-capture-number">A</span><div><h3>Referência da cena</h3><p>Opcional. Serve para lembrar a situação fotografada; não é a imagem do resultado.</p></div></div><label class="button button-secondary student-capture-button">Fotografar ou anexar</label></div><div class="student-form-group"><h3>Dados da exposição</h3><p class="student-form-group-intro">Preencha o que foi realmente usado na fotografia.</p><div class="student-form-grid"><label class="form-field student-span-2">Título<input value="Teste EI 200 — FeCl₃"></label><label class="form-field">Data<input type="date" value="2026-10-01"></label><label class="form-field">Filme<input value="Fuji Super H-RU"></label><label class="form-field">EI<input value="200"></label><label class="form-field">Abertura<input value="f/64"></label><label class="form-field">Tempo sem reciprocidade<input value="4 s"></label><label class="form-field">Tempo com reciprocidade<input value="7 s" readonly></label></div></div><div class="student-sticky-action"><button class="button button-primary">Salvar exposição e continuar →</button></div></form></section>`,
'process-choice':`${recordHeader}${stepNav('process')}<section class="student-workflow-panel">${workflow}<section class="student-process-path-choice"><div class="student-process-choice-intro"><h3>O processamento já aconteceu?</h3></div><div class="student-process-path-options"><article><span>Não</span><h4>Vou revelar agora</h4><a class="button button-primary">Escolher roteiro</a></article><article data-recorded-process-path><span>Sim</span><h4>Já revelei</h4><a class="button button-secondary">Registrar</a></article></div><div class="student-process-secondary-action"><a class="student-link">Registrar etapa por etapa, sem roteiro</a></div></section></section>`,
'process-plan':`${recordHeader}${stepNav('process')}<section class="student-workflow-panel">${workflow}<section class="student-caderno-plan-card"><div class="student-caderno-plan-head"><div><p class="student-kicker">Roteiro associado</p><h3>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h3></div><span class="student-plan-progress">0 / 9 etapas</span></div><div class="student-caderno-plan-next"><span>Próxima etapa</span><strong>Primeira revelação</strong><small>07:00</small></div><div class="student-plan-intent-grid"><article><span>Agora</span><h4>Revelar no laboratório</h4><a class="button button-primary">Abrir laboratório</a></article><article data-recorded-process-path><span>Já realizado</span><h4>Registrar o que foi feito</h4><a class="button button-secondary">Registrar</a></article></div><div class="student-plan-secondary-actions"><a class="student-link">Trocar roteiro</a></div></section></section>`,
'process-partial':`${recordHeader}${stepNav('process')}<section class="student-workflow-panel">${workflow}<section class="student-caderno-plan-card"><div class="student-caderno-plan-head"><div><p class="student-kicker">Em andamento</p><h3>Positivo direto — Parodinal EI 200 — FeCl₃ + amônia</h3></div><span class="student-plan-progress">5 / 9 etapas</span></div><div class="student-caderno-plan-next"><span>Próxima etapa</span><strong>Lavagem após branqueamento</strong><small>01:00</small></div><div class="student-actions student-plan-resume-actions"><a class="button button-primary">Continuar laboratório</a><a class="button button-secondary">Completar registro</a></div></section><details class="student-process-history"><summary>Etapas já registradas · 5 etapas</summary></details></section>`,
result:`${recordHeader}${stepNav('result')}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">03 · Resultado</p><h2 class="student-subtitle">O que obtive</h2></div><p>Reveja exposição e processamento antes de registrar o resultado.</p></div><section class="student-result-context"><div class="student-result-context-head"><p class="student-kicker">Este experimento</p><h3>Exposição e processamento, lado a lado</h3></div><div class="student-result-context-grid"><article><span>01 · Como expus</span><dl><div><dt>Filme</dt><dd>Fuji Super H-RU</dd></div><div><dt>EI</dt><dd>200</dd></div><div><dt>Abertura</dt><dd>f/64</dd></div><div><dt>Tempo</dt><dd>7 s</dd></div></dl><a>Rever exposição</a></article><article><span>02 · Como revelei</span><dl><div><dt>Etapas registradas</dt><dd>9</dd></div><div><dt>1ª revelação</dt><dd>Parodinal</dd></div><div><dt>Branqueamento</dt><dd>Cloreto férrico</dd></div><div><dt>Estado</dt><dd>Concluído</dd></div></dl><a>Rever processamento</a></article></div></section><div class="student-result-flow"><form class="student-mobile-form student-result-form"><div class="student-capture-block"><div><span class="student-capture-number">B</span><div><h3>Imagem do resultado</h3><p>Fotografia da chapa processada.</p></div></div><label class="button button-secondary student-capture-button">Fotografar ou anexar</label></div><label class="form-field">Anotações sobre o resultado<textarea rows="5"></textarea></label><p class="student-field-help">Anote o que observou no positivo e o que manteria ou mudaria numa próxima tentativa.</p><div class="student-result-actions"><button class="button button-primary">Salvar resultado</button></div></form></div></section>`
};
const params=new URLSearchParams(location.search);document.getElementById('screen').innerHTML=screens[params.get('screen')||'notebook'];
</script>
</body></html>
