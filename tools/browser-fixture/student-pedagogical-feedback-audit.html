<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Georgia,serif;--mono:"Courier New",monospace;--student-line-soft:#2d2b29;--ux-space-1:4px;--ux-space-2:8px;--ux-space-3:12px;--ux-space-4:16px;--ux-space-5:24px;--ux-space-6:32px;--ux-space-7:48px;--ux-space-8:64px}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css"><link rel="stylesheet" href="/assets/student-academic.css"><link rel="stylesheet" href="/assets/student-feedback.css"><link rel="stylesheet" href="/assets/student-rendered-fixes.css"><link rel="stylesheet" href="/assets/student-caderno.css"><link rel="stylesheet" href="/assets/student-quality-pass.css">
<title>Retorno pedagógico</title>
</head>
<body class="student-page"><div class="student-shell">
<header class="student-topbar"><a class="brand student-wordmark" href="/aluno/">JSaidler Fotografia</a><nav class="student-desktop-nav" aria-label="Área do aluno"><a href="/aluno/" data-nav="home">Início</a><a href="/aluno/cursos.php" data-nav="courses">Cursos</a><a href="/aluno/caderno.php" data-nav="notebook">Caderno</a><a href="/aluno/ferramentas.php" data-nav="laboratory">Laboratório</a></nav><span class="student-topbar-spacer"></span><button class="button button-secondary button-compact student-tools-trigger">Atalhos</button><details class="student-user-menu"><summary>Conta</summary></details></header>
<main class="student-main" id="screen"></main>
<nav class="student-mobile-nav" aria-label="Área do aluno"><a href="/aluno/" data-nav="home">Início</a><a href="/aluno/cursos.php" data-nav="courses">Cursos</a><a href="/aluno/caderno.php" data-nav="notebook">Caderno</a><a href="/aluno/ferramentas.php" data-nav="laboratory">Laboratório</a></nav>
</div>
<script>
const course='Positivo direto em filme de raio-X';const cohort='Turma Outubro 2026';const title='Retrato 07 — luz de janela';
const recordHeader=status=>`<header class="student-record-header"><div class="student-record-context"><a class="student-back">← Caderno</a><span class="student-status">${status}</span></div><p class="student-kicker">${course} · ${cohort}</p><h1 class="student-title student-title-record">${title}</h1><p class="student-record-purpose">Exposição, processamento e resultado no mesmo registro.</p></header>`;
const stepNav=`<nav class="student-step-nav student-record-step-nav"><a><span>01</span><div><strong>Exposição</strong><small>Como expus</small></div></a><a><span>02</span><div><strong>Processamento</strong><small>Como revelei</small></div></a><a aria-current="step"><span>03</span><div><strong>Resultado</strong><small>O que obtive</small></div></a></nav>`;
const resultContext=`<section class="student-result-context"><div class="student-result-context-head"><p class="student-kicker">Este experimento</p><h3>Exposição e processamento, lado a lado</h3></div><div class="student-result-context-grid"><article><span>01 · Como expus</span><dl><div><dt>Filme</dt><dd>Fuji Super H-RU</dd></div><div><dt>EI</dt><dd>200</dd></div><div><dt>Abertura</dt><dd>f/64</dd></div><div><dt>Tempo</dt><dd>7 s</dd></div></dl><a>Rever exposição</a></article><article><span>02 · Como revelei</span><dl><div><dt>Etapas registradas</dt><dd>9</dd></div><div><dt>1ª revelação</dt><dd>Parodinal</dd></div><div><dt>Branqueamento</dt><dd>Cloreto férrico</dd></div><div><dt>Estado</dt><dd>Concluído</dd></div></dl><a>Rever processamento</a></article></div></section>`;
const resultForm=`<form class="student-mobile-form student-result-form"><div class="student-capture-block"><div><span class="student-capture-number">B</span><div><h3>Imagem do resultado</h3><p>Fotografia da chapa processada para documentar o que foi obtido.</p></div></div></div><div class="student-media-strip"><figure class="student-media-card"><div style="aspect-ratio:4/5;background:linear-gradient(145deg,#d9d6cd,#6c6963 50%,#191919)"></div></figure></div><label class="form-field">Anotações sobre o resultado<textarea rows="4">Sombras agrupadas, separação melhor nos tons médios. A borda superior recebeu mais densidade.</textarea></label><p class="student-field-help">Anote o que observou no positivo e o que manteria ou mudaria numa próxima tentativa.</p></form>`;
const messageList=`<div class="student-message-list"><article><strong>Professor</strong><p>A exposição chegou onde eu esperava nos tons médios. Antes de alterar o EI, observe a diferença de densidade na borda e confira se a agitação do primeiro revelador foi uniforme.</p><small>04/10/2026 · 10:42</small></article><article><strong>Você</strong><p>Vou repetir mantendo EI 200 e controlando a agitação. A borda coincide com o lado em que iniciei o movimento da bandeja.</p><small>04/10/2026 · 11:08</small></article></div>`;
const review=(kind)=>{
 let status='Aguardando avaliação',state=`<div class="student-review-state"><strong>Enviado para avaliação</strong><p>O registro permanece aqui enquanto aguarda a avaliação. Se houver uma mensagem do professor, ela aparece na conversa abaixo.</p></div>`,messages='';
 if(kind==='revision'){status='Ajustes solicitados';state=`<div class="student-review-state is-action"><strong>Revisão solicitada</strong><p>Leia o retorno abaixo, ajuste o próprio registro e envie novamente. A conversa e o histórico permanecem neste resultado.</p></div><button class="button button-primary">Enviar revisão para avaliação</button>`;messages=messageList;}
 if(kind==='reviewed'){status='Revisado';state=`<div class="student-review-state is-complete"><strong>Avaliação concluída</strong><p>O registro fica preservado como foi avaliado. A conversa continua disponível se precisar retomar algum ponto com o professor.</p></div>`;messages=messageList;}
 return `${recordHeader(status)}${stepNav}<section class="student-workflow-panel"><div class="student-workflow-heading"><div><p class="student-kicker">03 · Resultado</p><h2 class="student-subtitle">O que obtive</h2></div><p>Reveja exposição e processamento antes de registrar o resultado.</p></div>${resultContext}<div class="student-result-flow">${resultForm}<section class="student-review-thread student-review-thread-${kind}"><p class="student-kicker">Acompanhamento do curso</p><h3>Avaliação</h3>${state}<details class="student-optional-fields" ${kind==='waiting'?'':'open'}><summary>Conversa${kind==='waiting'?'':' · 2'}</summary>${messages}<form class="student-form-grid"><label class="form-field student-span-2">Mensagem ao professor<textarea rows="3"></textarea></label><button class="button button-secondary">Enviar mensagem</button></form></details></section></div></section>`;
};
const screens={
 'home-feedback':`<p class="student-kicker">Área do aluno</p><h1 class="student-title">Início</h1><section class="student-dashboard-focus student-dashboard-feedback"><div class="student-dashboard-focus-copy"><p class="student-kicker">Retorno do professor</p><h2>${title}</h2><p>Revisão solicitada · ${course} · ${cohort}</p></div><div class="student-dashboard-focus-action"><a class="button button-primary">Ler retorno e revisar →</a></div></section><nav class="student-dashboard-links"><a class="student-dashboard-link"><span><strong>Curso</strong><small>${course} · ${cohort}</small></span><span>→</span></a><a class="student-dashboard-link"><span><strong>Caderno</strong><small>8 registros no caderno.</small></span><span>→</span></a></nav>`,
 'course-feedback':`<header class="student-academic-course-head"><p class="student-kicker">Curso</p><div class="student-academic-course-head-main"><h1 class="student-title">${course}</h1><span class="student-status">Turma ativa</span></div><div class="student-academic-course-meta"><span>${cohort}</span></div></header><section class="student-academic-attention"><div><p class="student-kicker">Acompanhamento</p><h2>Há algo para retomar</h2></div><div class="student-academic-attention-list"><a><span><strong>Revisão solicitada</strong><small>${title}</small></span><span>→</span></a><a><span><strong>1 dúvida aberta</strong><small>Continuar conversa</small></span><span>→</span></a></div></section><section class="student-academic-study"><div class="student-academic-study-head"><div><p class="student-kicker">Estudar</p><h2>Material</h2></div></div><div class="student-academic-material-list"><a class="student-academic-material-row"><span><strong class="student-academic-material-title">Exposição pensando no positivo</strong></span><span class="student-academic-material-state" data-state="available">Disponível</span></a><a class="student-academic-material-row"><span><strong class="student-academic-material-title">Processo químico completo</strong><small class="student-academic-material-detail">Parte desta página já está disponível.</small></span><span class="student-academic-material-state" data-state="partial">Parcial</span></a></div></section><div class="student-academic-course-actions"><a class="button button-secondary">Dúvidas e respostas</a></div>`,
 'result-waiting':review('waiting'),
 'result-revision':review('revision'),
 'result-reviewed':review('reviewed'),
 'questions-feedback':`<header class="student-course-context"><a class="student-course-context-back">← Cursos</a><div class="student-course-context-head"><div><p class="student-course-context-kicker">${cohort}</p><h1 class="student-course-context-title">${course}</h1></div><span class="student-status student-course-context-status">Turma ativa</span></div><nav class="student-course-context-nav"><a>Visão geral</a><a>Material</a><a aria-current="page">Dúvidas</a></nav></header><div class="student-page-heading"><div><p class="student-kicker">Curso</p><h2 class="student-subtitle">Dúvidas e respostas</h2></div><button class="button button-primary">Nova dúvida</button></div><section class="student-section student-evaluation-conversations"><div class="student-section-heading"><div><p class="student-kicker">Resultados</p><h3>Conversas de avaliação</h3></div></div><p class="student-field-help">O retorno sobre um resultado continua no próprio registro, junto da fotografia, exposição e processamento avaliados.</p><div class="student-test-list"><a class="student-test-row"><div><span class="student-status">Revisão solicitada</span><h3>${title}</h3><p>2 mensagens</p></div><strong>Abrir resultado →</strong></a><a class="student-test-row"><div><span class="student-status">Avaliação concluída</span><h3>Natureza-morta 03</h3><p>3 mensagens</p></div><strong>Abrir resultado →</strong></a></div></section><section class="student-section"><div class="student-section-heading"><div><p class="student-kicker">Material e prática</p><h3>Dúvidas da turma</h3></div></div><div class="student-test-list"><a class="student-test-row"><div><span class="student-status">Aberta</span><span class="student-status">Privada</span><h3>Reciprocidade em baixa energia</h3><p>João Aluno · Exposição</p></div><strong>Abrir →</strong></a></div></section>`
};
const name=new URLSearchParams(location.search).get('screen')||'home-feedback';document.getElementById('screen').innerHTML=screens[name]||screens['home-feedback'];
const active=name.startsWith('home')?'home':(name.startsWith('course')||name.startsWith('questions'))?'courses':'notebook';document.querySelectorAll(`[data-nav="${active}"]`).forEach(a=>a.setAttribute('aria-current','page'));
</script>
</body></html>
