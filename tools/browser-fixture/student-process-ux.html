<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#101010;--surface:#171717;--surface-2:#202020;--text:#f3f1ec;--muted:#aaa49a;--line:#383633;--line-strong:#d5d0c7;--focus:#73d2ac;--inverse-bg:#f3f1ec;--inverse:#101010;--body:Arial,sans-serif;--title:Arial,sans-serif;--mono:"Courier New",monospace}body{margin:0;padding:32px;background:var(--bg);color:var(--text)}</style>
<link rel="stylesheet" href="/template/page.css"><link rel="stylesheet" href="/assets/ui-core.css"><link rel="stylesheet" href="/assets/student-area.css"><link rel="stylesheet" href="/assets/student-workbench.css"><link rel="stylesheet" href="/assets/student-experience.css">
<title>Student process UX fixture</title>
</head>
<body class="student-page">
<main class="student-main">
<header class="student-record-header"><div class="student-record-context"><a class="student-back">← Caderno</a><span class="student-status student-status-draft">Rascunho</span></div><p class="student-kicker">Registro pessoal</p><h1 class="student-title student-title-record">Teste de processo</h1></header>
<section class="student-workflow-panel">
<div class="student-section-heading"><div><p class="student-kicker">02</p><h2 class="student-subtitle">Processamento</h2></div></div>
<div class="student-process-now"><p class="student-process-now-label">Próxima etapa</p><h2>Lavagem com água</h2></div>
<form class="student-process-step-form" data-process-step-form>
<fieldset class="choice-field"><legend>Etapa</legend><div class="choice-row student-process-choice-row">
<label class="choice-option"><input type="radio" name="stage_key" value="wash_after_first" checked data-stage-choice><span>Lavagem com água</span></label>
<label class="choice-option"><input type="radio" name="stage_key" value="stop_after_first" data-stage-choice><span>Banho interruptor</span></label>
<label class="choice-option"><input type="radio" name="stage_key" value="custom" data-stage-choice><span>Outra etapa</span></label>
<label class="choice-option"><input type="radio" name="stage_key" value="fixer" data-stage-choice><span>Fixação / hipossulfito</span></label>
<label class="choice-option"><input type="radio" name="stage_key" value="ferric" data-stage-choice><span>Cloreto férrico</span></label>
<label class="choice-option"><input type="radio" name="stage_key" value="dry" data-stage-choice><span>Secagem</span></label>
<label class="choice-option"><input type="radio" name="stage_key" value="second_development" data-stage-choice><span>Segunda revelação</span></label>
</div></fieldset>
<div data-stage-fields="development" class="student-process-stage-fields"><div class="student-form-grid"><label class="form-field student-span-2">Revelador<select name="developer_key" data-developer-select><option value="parodinal" data-preparation-mode="concentrate">Parodinal</option><option value="brewed-caffenol" data-preparation-mode="fresh">Brewed Caffenol</option><option value="rodinal" data-preparation-mode="concentrate">Rodinal / Adonal</option><option value="d76" data-preparation-mode="stock">Kodak D-76</option><option value="other" data-preparation-mode="custom">Outro</option></select></label><label class="form-field student-span-2" data-custom-developer hidden>Nome do revelador<input name="developer_name"></label><label class="form-field student-span-2">Preparo salvo<select name="saved_preparation_id"><option>Nenhum</option></select></label></div></div>
<div data-stage-fields="simple" class="student-process-stage-fields"><div class="student-form-grid"><label class="form-field">Tempo<input name="duration_simple"></label><label class="form-field student-span-2">Usar item do inventário<select name="inventory_item_id_simple"><option value="">Não usar</option><option value="4">Solução de teste · 500 ml</option></select></label><label class="form-field">Quantidade utilizada<input name="inventory_amount_simple" type="number"></label></div></div>
<div data-stage-fields="custom" class="student-process-stage-fields"><div class="student-form-grid"><label class="form-field student-span-2">Nome da etapa<input name="custom_label"></label><label class="form-field">Tempo<input name="duration_custom"></label></div></div>
<input type="hidden" data-stage-duration><input type="hidden" data-stage-inventory-item><input type="hidden" data-stage-inventory-amount>
<section class="student-context-timer" data-lab-timer><p class="student-kicker">Cronômetro</p><div class="student-form-grid"><label class="form-field">Tempo total<input value="1:00" data-timer-duration></label><label class="form-field">Agitação a cada<input value="" data-timer-interval></label></div><output class="student-timer-display" data-timer-display>01:00</output><p data-timer-cue></p><div class="student-actions"><button type="button" data-timer-start>Iniciar</button><button type="button" data-timer-pause>Pausar</button><button type="button" data-timer-reset>Reiniciar</button></div></section>
<div class="student-sticky-action"><button class="button button-primary" type="submit">Registrar etapa →</button></div>
</form>
<details class="student-process-history"><summary>Histórico do processamento · 2 etapas</summary><ol class="student-process-summary"><li><div><span class="student-process-step-number">01</span><strong>Parodinal</strong><small>1+36 · 26 °C · 7 min</small></div></li><li><div><span class="student-process-step-number">02</span><strong>Lavagem com água</strong><small>1 min</small></div></li></ol></details>
</section>
</main>
<script defer src="/assets/ui-core.js"></script><script defer src="/assets/student-workbench.js"></script><script defer src="/assets/student-experience.js"></script>
</body></html>
